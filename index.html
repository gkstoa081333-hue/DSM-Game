<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<meta name="description" content="정신건강전문요원 수련 필기 대비 나 혼자만 수련레벨업: 정신의학·DSM-5 퀴즈 게임">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="수련레벨업">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>나 혼자만 수련레벨업</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#05080f;--card:#0b1322;--card2:#121d33;--ink:#e9f2ff;--sub:#8ea3c4;--line:#1d3557;--acc:#2f8cff;--gold:#ffc94d;--ok:#3ddc97;--ng:#ff5d73;--glow:0 0 0 1px rgba(64,156,255,.35),0 0 18px rgba(47,140,255,.18)}
*{box-sizing:border-box}
html{background:#05080f;-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{margin:0;background:radial-gradient(circle at 50% -10%,#0f2a52,var(--bg) 55%);background-attachment:fixed;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.card.small{padding:14px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.96)}.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--sub)}
.btn.big{font-size:1.08rem;padding:13px 28px}.btn.tiny{font-size:.78rem;padding:6px 12px}
.promo-btn{background:linear-gradient(135deg,#ffc94d,#ff7b4d);color:#2a1a00;animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 22px rgba(255,201,77,.6)}}
.muted{color:var(--sub);font-size:.85rem}
/* rank */
.rankcard{text-align:center;background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--tc) 22%,var(--card)),var(--card) 70%);border-color:color-mix(in srgb,var(--tc) 45%,var(--line))}
.emblem{margin:0 auto;border-radius:24%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--tc) 70%,#fff),var(--tc) 55%,color-mix(in srgb,var(--tc) 50%,#000));box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 40%,transparent),0 8px 26px color-mix(in srgb,var(--tc) 40%,transparent);transform:rotate(45deg)}
.emblem{line-height:1}.emblem::before{content:none}
.emblem>*{transform:rotate(-45deg)}
.rk-name{font-size:1.6rem;font-weight:900;margin-top:20px;color:var(--tc)}
.rk-sub{color:var(--sub);font-size:.9rem}
.lpbar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px auto 0;max-width:360px}
.lpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff9d4d);transition:width .6s}
.ladder{display:flex;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.ladder span{display:flex;flex-direction:column;align-items:center;font-size:1.2rem;padding:6px 8px;border-radius:12px;opacity:.35;min-width:58px}
.ladder span small{font-size:.66rem;color:var(--sub)}
.ladder span.done{opacity:.75}.ladder span.on{opacity:1;background:color-mix(in srgb,var(--tc) 20%,transparent);outline:1.5px solid var(--tc)}
.promo-btn.big{margin-top:14px}
/* modes */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:transform .1s,border-color .2s}
.mode:hover:not(:disabled){border-color:var(--acc)}.mode:active:not(:disabled){transform:scale(.97)}
.mode:disabled{opacity:.45;cursor:default}
.mode.main{grid-column:1/-1;background:linear-gradient(135deg,#0d3b80,#1a5fd1);border-color:#4aa3ff;box-shadow:0 0 22px rgba(47,140,255,.35)}
.mode .mi{font-size:1.6rem}.mode b{font-size:1.02rem}.mode small{color:var(--sub);font-size:.8rem}
.mode.main small{color:#cfe4ff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--card2);border-radius:12px;padding:9px 4px;text-align:center}
.stats b{display:block;font-size:1.15rem}.stats small{color:var(--sub);font-size:.7rem}
details{margin-top:12px}summary{cursor:pointer;color:var(--sub);font-size:.9rem}
.rules{font-size:.86rem;padding-left:18px}
/* arena */
.arena{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;position:sticky;top:calc(6px + env(safe-area-inset-top));z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.arena.promo{background:linear-gradient(135deg,#3b2a10,#1b1f2e);border-color:#ffc94d;text-align:center;position:static}
.promo-title{font-weight:900;font-size:1.3rem;color:var(--gold)}
.bossrow{display:flex;gap:14px;align-items:center}
.bossemoji{font-size:3rem;width:70px;height:70px;display:flex;align-items:center;justify-content:center;background:var(--card2);border-radius:18px;flex:none}
.bossemoji.hit{animation:hit .4s}.bossemoji.dead{filter:grayscale(1);opacity:.5}
@keyframes hit{20%{transform:translateX(-8px) rotate(-8deg);background:#5a2030}60%{transform:translateX(6px) rotate(5deg)}}
.bossinfo{flex:1;min-width:0}
.bossname{font-weight:900}.bossdom{font-size:.78rem;color:var(--sub)}
.hp{height:12px;background:#3a2030;border-radius:99px;overflow:hidden;margin-top:4px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff4d6d,#ff9d4d);transition:width .45s}
.hpt{font-size:.75rem;color:var(--sub);margin-top:2px}
.plrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.arena>.plrow:first-child{margin-top:0}
.hearts{font-size:1.05rem;letter-spacing:1px}.hearts.big{font-size:1.4rem}
.combo{font-weight:900;color:var(--sub)}.combo.hot{color:#ff9d4d}
.lpd{font-weight:900}.lpd.up{color:var(--ok)}.lpd.down{color:var(--ng)}
.score{font-weight:900}
.pips{display:flex;gap:6px;margin-top:10px}
.pips span{flex:1;text-align:center;background:var(--card2);border-radius:10px;padding:3px 0;font-size:1rem;opacity:.4}
.pips span.now{opacity:1;outline:1.5px solid var(--acc)}.pips span.ok{opacity:1;background:rgba(61,220,151,.18)}.pips span.ng{opacity:.8;background:rgba(255,107,107,.18)}
.pips.big span{font-weight:900;padding:8px 0;opacity:1}
.items{display:flex;gap:8px;align-items:center;margin-top:10px}
.item{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.item:disabled{opacity:.4;cursor:default}.item.ghost{cursor:default;color:var(--sub)}
.timer{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--gold))}
.tleft{text-align:right;font-weight:900;font-size:.85rem;margin-top:2px}
/* question */
.meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--sub);margin-bottom:8px}
.tag{background:var(--card2);color:#c9c2ff;padding:2px 10px;border-radius:99px}
.q{font-size:1.06rem;font-weight:700;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:2px solid transparent;border-radius:12px;padding:12px 14px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:rgba(61,220,151,.13)}.opt.ng{border-color:var(--ng);background:rgba(255,107,107,.13)}
.opt.gone{opacity:.25}
.idkbtn{width:100%;background:transparent;border:2px dashed var(--line);color:var(--sub);border-radius:12px;padding:10px;font:inherit;cursor:pointer}
.idkbtn:hover:not(:disabled){color:var(--ink);border-color:#8a93a8}.idkbtn:disabled{opacity:.35}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card2);font-size:.92rem}
.fb .h{font-weight:900;margin-bottom:2px}.fb.ok .h{color:var(--ok)}.fb.ng .h{color:var(--ng)}.fb.idk .h{color:#c4cad8}
.src{margin-top:8px;font-size:.78rem;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.src a{color:#b9b1ff}
.src .rep{margin-left:auto;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.acc p{margin:4px 0}.warn{color:var(--ng);font-size:.85rem}
.privacy{margin-top:10px;background:var(--card2);border-radius:12px;padding:10px 12px;font-size:.82rem}.privacy ul{padding-left:18px;margin:6px 0}
button.rep{margin-left:auto;background:transparent;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font:inherit;font-size:.78rem;cursor:pointer}
.repbox textarea{margin-top:8px;min-height:70px;font-size:.85rem}
.lv{color:var(--gold);letter-spacing:1px}
.weak .btn{white-space:nowrap;flex:none}
.weak{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0}
.gates{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.gate{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.gate .ge{font-size:2rem}.gate small{color:var(--sub);font-size:.74rem}.gate.clear{border-color:var(--ok);background:rgba(61,220,151,.08)}
.finalboss{text-align:center;opacity:.6}.finalboss.open{opacity:1;border-color:var(--gold);box-shadow:0 0 30px rgba(255,201,77,.15)}
input#nick,.joinrow input{width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:1rem;margin-top:6px;text-align:center}
.joinrow{display:flex;gap:8px;margin-top:14px;align-items:center}.joinrow input{margin:0;letter-spacing:4px;text-transform:uppercase}
.code{font-size:2.6rem;font-weight:900;letter-spacing:8px;color:var(--gold);margin:10px 0 16px}
.duelbar{display:flex;flex-direction:column;gap:4px;margin-top:8px}.duelbar>div{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.duelbar>div i{display:block;height:100%;background:var(--ok);transition:width .3s}.duelbar>div.opp i{background:var(--ng)}
.vs{display:flex;justify-content:center;align-items:center;gap:18px;margin:14px 0}.vs>div{display:flex;flex-direction:column;align-items:center}
.vs span{font-size:2.2rem;font-weight:900}.vs .x{color:var(--sub);font-weight:900}
.tabs{display:flex;gap:6px;margin-top:10px}.tab{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:8px 4px;font:inherit;font-size:.85rem;cursor:pointer}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.rrow{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.rrow.me{background:rgba(124,108,255,.15);border-radius:10px}.rno{font-weight:900;text-align:center}.rnick{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rval{color:var(--sub);font-size:.88rem;text-align:right}
.nickline{margin-bottom:6px}
.oxtag{background:var(--acc);color:#fff;border-radius:6px;padding:1px 6px;font-size:.75rem;vertical-align:middle}
.oxbox{background:var(--card2);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:-4px 0 14px;font-weight:700}
.badge.auto{background:rgba(124,108,255,.18);color:#c9c2ff}
.gametitle{text-align:center;font-weight:900;font-size:1.35rem;letter-spacing:.5px;margin:4px 0 12px;color:#dbe9ff;text-shadow:0 0 14px rgba(47,140,255,.6)}
.gametitle small{display:block;font-size:.72rem;font-weight:500;color:var(--sub);letter-spacing:0;text-shadow:none}
.gametitle b{color:#5fb0ff}
.card,.arena,.mode{box-shadow:var(--glow)}
.emblem{position:relative}.emblem .rkl{position:absolute;right:-6px;bottom:-6px;transform:rotate(-45deg);background:#05080f;border:2px solid var(--tc);color:var(--tc);border-radius:8px;padding:0 6px;line-height:1.4}
.hname{display:block;margin-top:24px;font-size:.85rem;color:var(--sub);font-weight:700}
.ladder span b{font-size:1.1rem;color:var(--tc)}
.sysbg{position:fixed;inset:0;background:rgba(2,6,14,.7);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;animation:fadein .2s}
.sys{width:100%;max-width:380px;background:linear-gradient(180deg,rgba(10,30,62,.96),rgba(6,16,34,.96));border:1.5px solid #4aa3ff;border-radius:6px;box-shadow:0 0 30px rgba(47,140,255,.55),inset 0 0 20px rgba(47,140,255,.15);padding:18px 18px 14px;text-align:center;color:#e6f1ff}
.syshead{display:inline-block;border:1px solid #4aa3ff;padding:2px 14px;margin-bottom:10px;font-weight:900;letter-spacing:2px;color:#9fd0ff}
.sys p{margin:6px 0;font-weight:700}
.sysok{margin-top:12px;background:transparent;border:1px solid #4aa3ff;color:#9fd0ff;border-radius:4px;padding:6px 24px;font:inherit;font-weight:700;cursor:pointer}
.systag{color:#5fb0ff;font-weight:900;letter-spacing:2px}
.shadow{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(8,10,20,.92);border:1px solid #6a5cff;color:#cfc8ff;padding:8px 16px;border-radius:99px;font-weight:700;font-size:.85rem;z-index:70;box-shadow:0 0 18px rgba(106,92,255,.5);animation:fl2 1.3s forwards;pointer-events:none}
@keyframes fl2{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.badge{background:rgba(255,201,77,.15);color:var(--gold);border-radius:99px;padding:1px 8px;font-weight:700}
.gain{color:var(--gold);font-weight:700;margin-left:8px;font-size:.88rem}
.nav{display:flex;justify-content:flex-end;margin-top:12px}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.float{position:fixed;left:50%;top:36%;transform:translateX(-50%);font-weight:900;font-size:1.7rem;color:var(--gold);pointer-events:none;animation:fl 1.1s forwards;z-index:50;text-shadow:0 2px 14px rgba(0,0,0,.6);white-space:nowrap}
@keyframes fl{0%{opacity:0;transform:translate(-50%,12px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px)}}
/* result */
.hero{text-align:center;padding:24px 18px}.hero h1{font-weight:900;font-size:1.6rem;margin:10px 0 4px}.hero h2{margin:6px 0}
.celebrate{border-color:var(--gold);box-shadow:0 0 40px rgba(255,201,77,.25)}
.bosslist{display:flex;justify-content:center;gap:8px;margin:14px 0}
.bosslist span{display:flex;flex-direction:column;align-items:center;font-size:1.8rem;background:var(--card2);border-radius:14px;padding:6px 8px;min-width:54px}
.bosslist span small{font-size:.68rem;font-weight:700}.bosslist .ok small{color:var(--ok)}.bosslist .ng{opacity:.55}.bosslist .ng small{color:var(--ng)}
.rkchange{display:flex;justify-content:center;align-items:center;gap:18px;margin:16px 0 6px}
.rkchange>div{display:flex;flex-direction:column;align-items:center;gap:10px}
.rkchange small{font-size:.8rem;font-weight:700}
.rkchange .arrow{font-weight:900;font-size:.95rem;line-height:1.3}.arrow.up{color:var(--ok)}.arrow.down{color:var(--ng)}
.rkchange.small{margin:8px 0}
.event{margin:8px auto 0;max-width:340px;padding:8px 12px;border-radius:12px;font-weight:900}
.event.up{background:rgba(61,220,151,.15);color:var(--ok)}.event.down{background:rgba(255,107,107,.15);color:var(--ng)}.event.promo{background:rgba(255,201,77,.15);color:var(--gold)}
.row{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:.86rem;margin:8px 0}
.row .b{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}.row .b i{display:block;height:100%}
.wrong{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;font-size:.9rem}.wrong .a{color:var(--ok);font-weight:700}
pre{white-space:pre-wrap;font-size:.8rem;background:var(--card2);padding:10px;border-radius:10px;font-family:inherit}
/* codex */
.cxhead{display:flex;justify-content:space-between;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cx{display:flex;align-items:center;justify-content:center;text-align:center;min-height:62px;border-radius:12px;background:var(--card2);color:#4a5068;font-weight:900;font-size:1.2rem;border:1px dashed var(--line);padding:6px}
.cx.on{background:linear-gradient(135deg,#2e2a5a,#3b2f6e);color:var(--ink);font-size:.8rem;font-weight:700;border:1px solid #6d5cff;cursor:pointer;font-family:inherit}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.mcard{max-width:520px;width:100%}

@media (max-width:520px){
 body{font-size:15px}
 .card{padding:14px;border-radius:16px}
 .arena{padding:10px 12px;border-radius:16px}
 .bossemoji{width:52px;height:52px;font-size:2.2rem;border-radius:14px}
 .bossrow{gap:10px}.bossname{font-size:.92rem}
 .plrow{margin-top:6px}.pips{margin-top:6px}.pips span{font-size:.85rem}
 .q{font-size:1rem}
 .opt{padding:13px 12px;font-size:.95rem;min-height:48px}
 .idkbtn{min-height:44px}
 .modes{gap:8px}.mode{padding:12px}.mode .mi{font-size:1.4rem}
 .stats b{font-size:1rem}
 .rk-name{font-size:1.4rem}
 .ladder span small{font-size:.6rem}
 .rkchange{gap:10px}
 .nav .btn{min-height:46px}
 #next{width:100%}
}
@media (max-height:700px) and (max-width:520px){.arena{position:static}}
.install{display:none;margin-top:10px;font-size:.82rem;color:var(--sub);background:var(--card2);border-radius:12px;padding:10px;text-align:left}
textarea{width:100%;min-height:90px;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:.75rem}
@media (max-width:420px){.row{grid-template-columns:110px 1fr 36px}.ladder span{min-width:52px;padding:5px}}
</style>
</head>
<body><div class="wrap" id="app"></div>
<script>
const D1="DSM-5 체계";const D2="조현병 스펙트럼";const D3="기분장애";const D4="불안·강박·외상";const D5="성격장애";const D6="신경인지·물질";const D7="치료";const D8="자살·지역사회·법";const D9="이론·정신병리·역사";const D10="신체·해리·섭식·수면·아동";const D11="정신건강복지법·제도";const D12="영어 약어·용어";

"DSM-5 체계", "발모광(모발뽑기장애)은 DSM-5에서 어느 범주에 속하나?", ["강박 및 관련 장애", "파괴적, 충동조절 및 품행장애", "신체증상 및 관련 장애", "불안장애"], "DSM-IV에서는 충동조절장애였는데, DSM-5에서 강박 및 관련 장애로 옮겨졌어요."], ["조현병 스펙트럼", "DSM-5 조현병의 5가지 핵심 증상에 해당하지 않는 것은?", ["강박사고", "망상", "환각", "음성증상"], "5가지 핵심 증상은 망상, 환각, 와해된 언어, 와해되거나 긴장증적인 행동, 음성증상이에요."], ["조현병 스펙트럼", "망상과 환청이 2개월째 이어지는 환자의 가장 적절한 진단은?", ["조현양상장애", "단기 정신병적 장애", "조현병", "망상장애"], "1일~1개월 미만이면 단기 정신병적 장애, 1개월~6개월 미만이면 조현양상장애, 6개월 이상이면 조현병이에요."], ["조현병 스펙트럼", "다음 중 조현병의 음성증상은?", ["정동 둔마", "피해망상", "환청", "지리멸렬한 언어"], "음성증상은 정상 기능이 줄어들거나 사라지는 것이에요(정동 둔마, 무언증, 무의욕, 무쾌감)."], ["조현병 스펙트럼", "Bleuler의 조현병 기본 증상(4A)에 해당하지 않는 것은?", ["환각(Hallucination)", "연상 이완(Association)", "정동 장애(Affect)", "양가감정(Ambivalence)"], "4A는 연상 이완, 정동 장애, 양가감정, 자폐성(Autism)이에요. Bleuler는 환각·망상을 부수 증상으로 봤습니다."], ["조현병 스펙트럼", "Schneider의 1급 증상에 해당하는 것은?", ["사고 전파", "정동 둔마", "연상 이완", "긴장증"], "사고 전파, 사고 투입, 사고 탈취, 논평하는 환청, 조종망상 등이 1급 증상이에요."], ["조현병 스펙트럼", "조현병 도파민 가설에서 양성증상과 관련된 경로는?", ["중뇌변연계 도파민 과활성", "중뇌피질계 도파민 과활성", "흑질선조체 도파민 과활성", "결절누두 도파민 과활성"], "양성증상은 중뇌변연계 과활성, 음성·인지 증상은 중뇌피질계 저활성과 관련돼요. 흑질선조체 차단은 추체외로 부작용, 결절누두 차단은 고프로락틴혈증을 일으킵니다."], ["조현병 스펙트럼", "조현병에서 예후가 좋은 요인은?", ["급성 발병과 뚜렷한 유발 요인", "어린 나이 발병", "음성증상 우세", "서서히(잠행성) 발병"], "늦은 발병, 급성 발병, 뚜렷한 유발 요인, 기분 증상 동반, 좋은 병전 기능이 좋은 예후 요인이에요."], ["조현병 스펙트럼", "조현정동장애 진단에 꼭 필요한 조건은?", ["기분 삽화 없이 망상이나 환각만 2주 이상 있었던 기간", "정신병 증상이 기분 삽화 중에만 나타남", "망상만 6개월 이상", "증상 지속 1개월 미만"], "기분 삽화 중에만 정신병 증상이 있으면 정신병적 양상을 동반한 기분장애로 봐요."], ["조현병 스펙트럼", "망상장애에 대한 설명으로 옳은 것은?", ["망상이 1개월 이상 지속되고 망상 외 기능은 비교적 유지됨", "뚜렷한 환청이 주된 증상", "음성증상이 6개월 이상 두드러짐", "반드시 기분 삽화를 동반"], "망상과 관련된 부분 말고는 행동이 눈에 띄게 이상하지 않은 경우가 많아요."], ["조현병 스펙트럼", "조현병 역학에 대한 설명으로 옳은 것은?", ["남성이 여성보다 발병 나이가 이르다", "여성이 남성보다 발병 나이가 이르다", "평생유병률은 약 10%다", "노년기 발병이 가장 흔하다"], "평생유병률은 약 1%예요. 남성은 10대 후반~20대 중반, 여성은 20대 후반~30대 초반에 주로 발병합니다."], ["기분장애", "제II형 양극성장애의 진단 조건으로 옳은 것은?", ["주요우울 삽화 1회 이상 + 경조증 삽화 1회 이상, 조증 삽화는 없음", "조증 삽화 1회 이상", "경조증과 경도 우울 증상이 2년 이상 반복", "주요우울 삽화만 반복"], "조증 삽화가 한 번이라도 있으면 제I형이에요."], ["기분장애", "주요우울 삽화의 진단 기준으로 옳은 것은?", ["증상 5개 이상, 2주 이상(우울 기분이나 흥미 상실 중 1개 포함)", "증상 3개 이상, 1주 이상", "증상 5개 이상, 1개월 이상", "증상 2개 이상, 2년 이상"], "9개 증상 중 5개 이상이 2주 이상 거의 매일 나타나야 해요."], ["기분장애", "성인의 지속성 우울장애(기분부전증) 진단에 필요한 최소 기간은?", ["2년", "6개월", "1년", "5년"], "성인은 2년, 아동·청소년은 1년이에요."], ["기분장애", "조증 삽화 진단에 필요한 최소 기간은? (입원이 필요한 경우는 제외)", ["1주", "4일", "2주", "2일"], "조증은 1주 이상(입원이 필요하면 기간과 관계없음), 경조증은 4일 이상이에요."], ["기분장애", "리튬의 부작용이 아닌 것은?", ["무과립구증", "갑상선기능저하증", "손 떨림", "다뇨(신성 요붕증)"], "무과립구증은 클로자핀, 카바마제핀에서 주의해야 해요. 리튬은 치료 범위가 좁아서 혈중농도를 확인해야 합니다."], ["기분장애", "리튬 독성 위험을 높이는 것은?", ["NSAIDs나 티아지드 이뇨제 병용, 탈수", "소금을 많이 먹는 식사", "수분 섭취 늘리기", "카페인 섭취"], "나트륨이 부족하거나 탈수가 되면 신장에서 리튬이 다시 흡수돼 혈중농도가 올라가요."], ["기분장애", "DSM-5에서 '계절성 우울'은 어떻게 다루나?", ["우울 삽화의 '계절성 동반' 명시자", "독립된 진단", "적응장애의 하위유형", "양극성장애에만 붙는 명시자"], "주요우울장애와 양극성장애의 우울 삽화 모두에 붙일 수 있는 명시자예요."], ["기분장애", "월경전불쾌감장애는 DSM-5에서 어느 범주에 속하나?", ["우울장애", "불안장애", "신체증상 및 관련 장애", "성기능부전"], "DSM-5에서 우울장애 범주에 정식 진단으로 들어갔어요."], ["기분장애", "성인 순환성장애 진단에 필요한 최소 기간은?", ["2년", "1년", "6개월", "4일"], "경조증 증상과 우울 증상이 번갈아 나타나는 기간이 성인 2년(아동·청소년 1년) 이상이어야 하고, 어느 쪽도 삽화 기준은 충족하지 않아야 해요."], ["기분장애", "우울증의 모노아민 가설에서 기능이 떨어져 있다고 보는 신경전달물질은?", ["세로토닌과 노르에피네프린", "도파민 과다", "GABA 과다", "글루타메이트 과다"], "대부분의 항우울제가 세로토닌이나 노르에피네프린을 늘리는 방식으로 작용해요."], ["기분장애", "'멜랑콜리아 양상 동반' 우울의 특징은?", ["아침에 더 심하고 새벽에 일찍 깸", "과식과 과다수면", "거절에 대한 민감성", "좋은 일에는 기분이 나아짐"], "나머지 세 보기는 '비전형적 양상'의 특징이에요."], ["불안·강박·외상", "교통사고 2주 뒤 침투적 기억, 회피, 과각성이 나타난 경우 가장 적절한 진단은?", ["급성 스트레스장애", "외상후 스트레스장애", "적응장애", "범불안장애"], "외상 후 3일~1개월 사이면 급성 스트레스장애, 1개월을 넘기면 PTSD예요."], ["불안·강박·외상", "범불안장애 진단에 필요한 최소 증상 지속 기간은?", ["6개월", "2주", "1개월", "3개월"], "조절하기 어려운 과도한 걱정이 6개월 이상, 걱정하는 날이 그렇지 않은 날보다 많아야 해요."], ["불안·강박·외상", "공황발작의 특징으로 옳은 것은?", ["갑작스러운 극심한 공포가 몇 분 안에 최고조에 이름", "몇 시간에 걸쳐 서서히 심해짐", "최소 2주 동안 이어짐", "하루 종일 일정하게 유지됨"], "13개 증상 중 4개 이상이 몇 분 안에 최고조에 이르러요."], ["불안·강박·외상", "공황장애 진단에 필요한 조건은?", ["예상치 못한 공황발작이 반복되고, 그 뒤 1개월 이상 걱정하거나 행동이 바뀜", "공황발작 1회", "공황발작 후 6개월 이상 걱정", "특정 상황에서만 일어나는 공황발작"], "추가 발작이나 그 결과를 계속 걱정하거나, 발작을  행동치료(DBT)", "자유연상 중심 고전적 정신분석", "체계적 둔감법", "전기경련요법"], "Linehan이 만든 DBT는 정서조절, 고통감내, 대인관계, 마음챙김 기술을 훈련해요."], ["성격장애", "마술적 사고, 관계사고, 기이한 지각 경험과 말투가 특징인 성격장애는?", ["조현형", "조현성", "편집성", "연극성"], "조현형 성격장애는 DSM-5에서 조현병 스펙트럼에도 함께 올라가 있어요."], ["성격장애", "늘 관심의 중심이 되려 하고, 감정 표현이 피상적이며 자주 바뀌는 성격장애는?", ["연극성", "자기애성", "경계성", "의존성"], "자기애성은 웅대함과 공감 부족, 경계성은 불안정한 관계와 충동성이 핵심이에요."], ["성격장애", "강박성 성격장애의 핵심 특징은?", ["완벽주의, 질서, 통제에 대한 집착", "침투적인 강박사고와 반복되는 의식 행동", "물건을 버리지 못하고 쌓아둠", "신체 결함에 대한 집착"], "강박장애와 달리 강박성 성격장애는 자기 성향을 문제로 느끼지 않는 경우가 많아요."], ["신경인지·물질", "섬망을 치매와 구분하는 가장 중요한 특징은?", ["급성 발병과 의식·주의 수준이 하루 중 변동", "기억력 저하", "언어장애", "노인에게 흔함"], "치매는 서서히 진행하고 초기에는 의식이 맑아요."], ["신경인지·물질", "DSM-5 알코올사용장애에서 11개 기준 중 6개 이상을 충족하면 심각도는?", ["고도", "경도", "중등도", "판단 불가"], "2~3개는 경도, 4~5개는 중등도, 6개 이상은 고도예요. 첨부하신 DSM-5 요약 자료에는 다르게 적혀 있으니 이 기준으로 고쳐 외우세요."], ["신경인지·물질", "베르니케 뇌병증의 원인은?", ["티아민(비타민 B1) 결핍", "비타민 B12 결핍", "엽산 결핍", "나이아신 결핍"], "안구운동 이상, 운동실조, 혼돈이 3대 증상이에요. 포도당보다 티아민을 먼저 줘야 합니다."], ["신경인지·물질", "코르사코프 증후군의 특징은?", ["최근 기억장애와 작화증", "환시와 진전", "갑작스러운 의식 저하", "강박적 반복 행동"], "베르니케 뇌병증 뒤에 오는 경우가 많고, 기억의 빈틈을 꾸며낸 이야기로 채워요(작화증)."], ["신경인지·물질", "알코올 금단 섬망(진전섬망)이 가장 흔히 나타나는 시기는?", ["마지막 음주 후 2~3일(48~72시간)", "마지막 음주 후 6시간 안", "마지막 음주 후 2주", "마지막 음주 후 1개월"], "진전은 6~8시간, 환각은 12~24시간, 경련은 24~48시간, 진전섬망은 48~72시간 무렵에 흔해요."], ["신경인지·물질", "알코올 금단 증상의 1차 치료 약물은?", ["벤조디아제핀", "항정신병 약물", "날트렉손", "디설피람"], "날트렉손과 디설피람은 금단이 끝난 뒤 재발을 막는 데 써요."], ["신경인지·물질", "디설피람의 작용 원리는?", ["알데히드 탈수소효소를 억제해 술을 마시면 불쾌한 반응이 생김", "오피오이드 수용체 차단", "GABA 작용 강화", "NMDA 수용체 조절"], "아세트알데히드가 쌓여 얼굴 홍조, 구역, 두근거림이 생겨요. 본인 동의가 꼭 필요합니다."], ["신경인지·물질", "아편계 약물 과다복용(동공 축소, 호흡 저하)의 해독제는?", ["날록손", "플루마제닐", "디설피람", "아캄프로세이트"], "플루마제닐은 벤조디아제핀 과다복용의 해독제예요."], ["신경인지·물질", "알츠하이머병 치료에 1차로 쓰는 약물 계열은?", ["아세틸콜린에스테라제 억제제(도네페질 등)", "도파민 작용제", "SSRI", "리튬"], "중등도 이상에서는 NMDA 길항제인 메만틴도 써요."], ["신경인지·물질", "알츠하이머병의 특징적인 병리 소견은?", ["베타아밀로이드 판과 신경섬유매듭", "루이소체", "여러 군데의 뇌경색", "흑질 퇴행"], "루이소체는 루이소체 치매·파킨슨병, 다발성 경색은 혈관성 치매와 관련돼요."], ["신경인지·물질", "인지기능이 오락가락하고, 생생한 환시 // 서버 기록과 기기 기록 합치기: 본 문제·도감·격파 관문은 합집합, 레벨테스트는 최신 결과, 기록은 높은 쪽
function mergeInto(remote) {
  if (!remote) return;
  fromStored(remote.seen).forEach(i => seen.add(i));
  fromStored(remote.codex).forEach(i => codex.add(i));
  fromStored(remote.wrong).forEach(i => { if (!codex.has(i) || wrong.has(i)) wrong.add(i); });
  const rl = remote.level;
  if (rl && rl.date && (!S.level.date || rl.date > S.level.date || (rl.date === S.level.date && (rl.hist || []).length > (S.level.hist || []).length))) S.level = rl;
  if (remote.dojo) {
    (remote.dojo.cleared || []).forEach(d => { if (!S.dojo.cleared.includes(d)) S.dojo.cleared.push(d); });
    S.dojo.best = S.dojo.best || {};
    for (const [k, v] of Object.entries(remote.dojo.best || {})) S.dojo.best[k] = Math.max(S.dojo.best[k] || 0, v);
    S.dojo.final = S.dojo.final || !!remote.dojo.final;
  }
  if (remote.rec) for (const k of Object.keys(remote.rec)) {
    const v = remote.rec[k];
    if (typeof v === "number") S.rec[k] = Math.max(S.rec[k] || 0, v);
    else if (k === "daily" && v && (!S.rec.daily || (v.date || "") > (S.rec.daily.date || ""))) S.rec.daily = v;
  }
  if (!S.nick && remote.nick) S.nick = remote.nick;
}
function snapshot() {
  return { ...data(), updatedAt: firebase.firestore.FieldValue.serverTimestamp(), app: "dsm-game" };
}
async function pullAndMerge() {
  try {
    const ref = ACC.db.collection("users").doc(ACC.user.uid);
    const doc = await ref.get();
    mergeInto(doc.exists ? doc.data() : null);
    store.set("pt_v4", data());
    await ref.set(snapshot());
    await ensureNick();
    await pushBoard();
    ACC.lastSync = new Date();
    if (!S.nick) { if (isGoogle()) nickSetup(); else if (!guestMode()) loginGate(); }
    else if (document.getElementById("gg")) { lobby(); systemMsg([`헌터 인증이 완료되었습니다.`, `돌아오신 것을 환영합니다, ${S.nick} 헌터님.`, `저장된 등급과 기록을 불러왔습니다.`]); }
    else if (document.querySelector(".rankcard")) lobby();
  } catch (e) { ACC.err = "기록 동기화에 실패했어요. 다음에 다시 시도할게요."; }
}
function scheduleSync() {
  if (!ACC.ready) return;
  clearTimeout(ACC.syncTimer);
  ACC.syncTimer = setTimeout(async () => {
    try { await ACC.db.collection("users").doc(ACC.user.uid).set(snapshot()); await pushBoard(); ACC.lastSync = new Date(); ACC.err = null; }
    catch (e) { ACC.err = "기록 동기화에 실패했어요. 인터넷 연결을 확인해 주세요."; }
    refreshAccountCard();
  }, 3000);
}

// Google 계정 연결: 익명 기록을 그대로 Google 계정에 옮김
async function linkGoogle() {
  const p = new firebase.auth.GoogleAuthProvider();
  try { await ACC.user.linkWithPopup(p); ACC.user = ACC.auth.currentUser; await pullAndMerge(); }
  catch (e) {
    if (e.code === "auth/credential-already-in-use" && e.credential) {
      // 다른 기기에서 이미 쓰던 Google 계정 → 그 계정으로 들어가서 이 기기 기록을 합침
      const local = JSON.parse(JSON.stringify(data()));
      S.nick = ""; // 그 Google 계정에 등록된 헌터명을 우선 복원
      await ACC.auth.signInWithCredential(e.credential);
      ACC.user = ACC.auth.currentUser; mergeInto(local); await pullAndMerge();
    } else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
      ACC.err = "Google 연결에 실패했어요(" + (e.code || "알 수 없음") + ")";
    }
  }
  refreshAccountCard();
}
const isGoogle = () => !!(ACC.user && ACC.user.providerData.some(p => p.providerId === "google.com"));
const guestMode = () => { try { return sessionStorage.getItem("pt_guest") === "1"; } catch (_) { return false; } };

  await ACC.auth.signOut(); // 로그아웃하면 새 익명 계정으로 다시 시작

  location.reload();
}

    await ACC.user.delete();

    if (e.code === "auth/requires-recent-login") { ACC.err = "보안을 위해 Google로 다시 로그인한 뒤 삭제해 주세요."; refreshAccountCard(); return; }
  }
  try { localStorage.removeItem("pt_v4"); localStorage.removeItem("pt_v3"); } catch (_) {}
  location.reload();
}

// ===================== 닉네임 · 랭킹 (names/{닉네임}, board/{uid}) =====================
const NICK_RE = /^[가-힣a-zA-Z0-9_]{2,12}$/;
const nickKey = n => n.toLowerCase();
// 이 기기의 닉네임이 서버에서 내 것인지 확인하고, 아니면 차지 시도 (계정 전환 대비)
async function ensureNick() {
  if (!S.nick) return;
  try {
    const ref = ACC.db.collection("names").doc(nickKey(S.nick));
    await ACC.db.runTransaction(async tx => {
      const d = await tx.get(ref);
      if (d.exists && d.data().uid !== ACC.user.uid) throw new Error("taken");
      if (!d.exists) tx.set(ref, { uid: ACC.user.uid });
    });
  } catch (e) { if (e.message === "taken") { S.nick = ""; save(); } }
}
async function claimNick(nick) {
  if (!NICK_RE.test(nick)) return "한글·영문·숫자·밑줄(_)로 2~12자로 정해 주세요.";
  if (!ACC.ready) return "서버에 연결하는 중이에요. 잠시 후 다시 시도해 주세요.";
  const newRef = ACC.db.collection("names").doc(nickKey(nick));
  const oldKey = S.nick ? nickKey(S.nick) : null;
  try {
    await ACC.db.runTransaction(async tx => {
      const d = await tx.get(newRef);
      if (d.exists && d.data().uid !== ACC.user.uid) throw new Error("taken");
      if (!d.exists) tx.set(newRef, { uid: ACC.user.uid });
      if (oldKey && oldKey !== nickKey(nick)) tx.delete(ACC.db.collection("names").doc(oldKey));
    });
  } catch (e) { return e.message === "taken" ? "이미 다른 사람이 쓰는 닉네임이에요." : "저장하지 못했어요. 다시 시도해 주세요."; }
  S.nick = nick; save();
  try { await pushBoard(); } catch (_) {}
  return "ok";
}
function boardRow() {
  const t = curTier(), sc = S.level.score == null ? -1 : S.level.score, n = S.dojo.cleared.length;
  return { nick: S.nick, tier: t, score: sc, rk: (t + 1) * 1000 + Math.max(sc, 0), dojo: n, final: !!S.dojo.final, dk: (S.dojo.final ? 100 : 0) + n,
    ta: S.rec.ta || 0, surv: S.rec.surv || 0, tests: S.rec.tests || 0, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
}
async function pushBoard() { if (ACC.ready && S.nick) await ACC.db.collection("board").doc(ACC.user.uid).set(boardRow()); }
async function fetchBoard(field) {
  const q = await ACC.db.collection("board").orderBy(field, "desc").limit(50).get();
  return q.docs.map(d => ({ uid: d.id, ...d.data() }));
}

// ===================== ⚡ 각성 측정 =====================
let G;
function startLT(){
  const order=shuf(DOMS.slice()),cnt={};DOMS.forEach(d=>cnt[d]=2);
  const extra=shuf(CORE.slice()).concat(shuf(DOMS.filter(d=>!CORE.includes(d))));
  for(let k=0;k<LT_N-DOMS.length*2;k++)cnt[extra.at(k%extra.length)]++;
  const plan=[];for(let r=0;r<4;r++)order.forEach(d=>{if(cnt[d]>r)plan.push(d)});
  const lv={};DOMS.forEach(d=>lv[d]=2);
  G={mode:"lt",plan,lv,used:new Set(),log:[],i:0};ltNext();
}
function pickLv(d,lv){
  const pool=idsOf(d).filter(i=>!G.used.has(i));
  for(const dl of [0,1,-1,2,-2]){const want=lv+dl;const c=pool.filter(i=>QB[i].lv===want);if(c.length){const f=c.filter(i=>!seen.has(i));return shuf(f.length?f:c)[0]}}
  return shuf(pool)[0];
}
function ltNext(){const d=G.plan[G.i];const id=pickLv(d,G.lv[d]);G.used.add(id);G.q=toQ(id,{noOX:true});ltQ()}
function ltQ(){
  const q=G.q,n=G.plan.length;
  app.innerHTML=`<div class="arena"><div class="plrow"><span class="score">⚡ 각성 측정</span><span class="muted">${G.i+1} / ${n}</span></div>
    <div class="lpbar" style="max-width:none"><i style="width:${G.i/n*100}%"></i></div>
    <p class="muted" style="margin:6px 0 0">맞히면 다음 문제가 어려워져요. 모르면 찍지 말고 '모름'</p></div>`+
    qCard(q,q.r,{showLv:true,nextLabel:G.i===n-1?"결과 보기 🏁":"다음 →"});
  bindQ(k=>{q.pick=k;q.r=judge(q,k);G.log.push({d:q.d,lv:q.lv,r:q.r,q});G.lv[q.d]=q.r==="ok"?Math.min(3,q.lv+1):Math.max(1,q.lv-1);if(q.r!=="ok")shake();ltQ()},
        ()=>{G.i++;if(G.i>=G.plan.length)ltEnd();else{ltNext();goTop()}});
}
function ltEnd(){
  const acc={};let E=0,P=0;
  G.log.forEach(x=>{acc[x.d]=acc[x.d]||{e:0,p:0};acc[x.d].p+=x.lv;P+=x.lv;if(x.r==="ok"){acc[x.d].e+=x.lv;E+=x.lv}});
  const dom={};Object.entries(acc).forEach(([k,v])=>dom[k]=Math.round(v.e/v.p*100));

    <p class="muted">정답 ${c} / ${G.log.length} · 어려운 문제일수록 점수 비중이 커요</p>
    ${nt===CAP&&!S.dojo.final?`<p class="muted">🏖️ S급(퇴사)은 S급 게이트를 넘어야만 얻을 수 있어요</p>`:""}
    ${t<CAP?`<p class="muted">다음 등급(${TIERS[t+1].n})까지 ${LT_CUT[t+1]-score}점</p>`:""}

  <div class="card"><b>먼저 공부할 영역</b>

  ${misses.length?`<div class="card"><b>틀리거나 모른 문제 ${misses.length}개</b>${misses.map(x=>`<div class="wrong">${esc(x.q.q)}<br><span class="a">정답: ${esc(x.q.o[x.q.a])}</span><br><span class="muted">${esc(x.q.e)}</span></div>`).join("")}</div>`:""}
  <div class="card"><b>결과 공유</b><pre>${esc(summary)}</pre>
   <div class="nav" style="justify-content:flex-start;gap:8px;flex-wrap:wrap"><button class="btn" id="cp">결과 복사</button><button class="btn ghost" id="lb">로비로</button></div></div>`;
  on("cp",async e=>{try{await navigator.clipboard.writeText(summary);e.target.textContent="복사됐어요 ✓"}catch(_){e.target.textContent="위 텍스트를 직접 복사해 주세요"}});

  else if(nt>prevT)setTimeout(()=>systemMsg([`등급이 상승했습니다.`,`${tierName(prevT)} → ${tierName(nt)}`,nt===CAP?"S급 게이트에 도전할 자격을 얻으려면 게이트를 모두 클리어하세요.":"다음 등급까지 계속 성장하세요."],"레벨 업"),400);
  goTop();
}

function startDojo(d){G={mode:"dj",d,qs:pickIds(idsOf(d),DOJO_N).map(toQ),i:0,ok:0,ng:0,pass:DOJO_PASS,fail:DOJO_N-DOJO_PASS+1,boss:BOSS[d]};djQ()}
function startFinal(){
  const per=Math.ceil(FINAL_N/DOMS.length),ids=[];DOMS.forEach(d=>pickIds(idsOf(d),per).forEach(i=>ids.push(i)));
  G={mode:"fin",d:"전 영역",qs:shuf(ids).slice(0,FINAL_N).map(i=>toQ(i,{noOX:true})),i:0,ok:0,ng:0,pass:FINAL_PASS,fail:FINAL_N-FINAL_PASS+1,boss:{e:"🏖️",n:"S급 게이트: 퇴사"}};djQ();
}
function djQ(hit){
  const q=G.qs[G.i],hp=Math.max(0,100-Math.round(G.ok/G.pass*100));
  const done=G.ok>=G.pass||G.ng>=G.fail||G.i===G.qs.length-1;
  app.innerHTML=`<div class="arena"><div class="bossrow"><div class="bossemoji ${hit||""} ${G.ok>=G.pass?"dead":""}">${G.boss.e}</div>
     <div class="bossinfo"><div class="bossname">${G.boss.n}</div><div class="bossdom">${esc(G.d)}</div>
      <div class="hp"><i style="width:${hp}%"></i></div>
      <div class="hpt">정답 ${G.ok}/${G.pass} · 남은 목숨 ${"❤️".repeat(Math.max(0,G.fail-G.ng))}${"🖤".repeat(Math.min(G.ng,G.fail))}</div></div></div></div>`+
    qCard(q,q.r,{counter:`${G.i+1} / ${G.qs.length}`,nextLabel:done&&q.r?"결과 보기":"다음 →"});
  bindQ(k=>{q.pick=k;q.r=judge(q,k);let h="";if(q.r==="ok"){G.ok++;h="hit";buzz(30);setTimeout(()=>floatText(G.ok>=G.pass?"💥 격파!":"-HP","#ffc94d"),40)}else{G.ng++;shake();buzz([60,40,60])}djQ(h)},
        ()=>{if(G.ok>=G.pass||G.ng>=G.fail||G.i===G.qs.length-1)djEnd();else{G.i++;djQ();goTop()}});
}
function djEnd(){
  const win=G.ok>=G.pass,fin=G.mode==="fin";
  if(!fin){S.dojo.best=S.dojo.best||{};S.dojo.best[G.d]=Math.max(S.dojo.best[G.d]||0,G.ok);if(win&&!S.dojo.cleared.includes(G.d))S.dojo.cleared.push(G.d)}
  const wasFinal=S.dojo.final;if(fin&&win)S.dojo.final=true;save();
  const all=S.dojo.cleared.length===DOMS.length;
  app.innerHTML=`<div class="card hero ${win?"celebrate":""}">
    ${fin&&win?emblem(TOP,120):`<div style="font-size:3.4rem">${win?"💥":"💀"}</div>`}
    <h1>${fin?(win?"S급 게이트 클리어! 🏖️":"아직 귀환할 수 없습니다…"):(win?`${G.boss.n} 처치!`:"게이트 공략 실패")}</h1>
    <p>${G.ok}개 정답 · ${G.ng}개 오답</p>
    <p class="muted">${fin?(win?(wasFinal?"다시 한 번 증명했어요.":"S급 헌터 '퇴사' 달성. 원래 세계로 귀환합니다. 고생 많았어요!"):`${FINAL_PASS}개를 맞혀야 해요. 약한 영역을 일반 모드로 다지고 다시 와요.`):(win?(all?`게이트 ${DOMS.length}개를 모두 클리어했어요!`+" S급 게이트가 열렸어요.":"게이트 지도에 클리어 표시가 생겼어요."):"일일 퀘스트로 이 영역을 단련하고 다시 도전해 보세요.")}</p>
    <div class="nav" style="justify-content:center;gap:8px;flex-wrap:wrap">
     ${!win&&!fin?`<button class="btn" id="pr">이 영역 단련하기</button>`:""}<button class="btn ${win?"":"ghost"}" id="map">게이트 지도</button><button class="btn ghost" id="lb">로비로</button></div></div>`;
  on("pr",()=>startPractice(G.d));on("map",dojoMap);on("lb",lobby);
  if(win)setTimeout(()=>systemMsg(fin?["S급 게이트를 클리어했습니다.","등급이 S급 '퇴사'로 상승했습니다.","원래 세계로 귀환합니다. 🏖️"]:[`게이트를 클리어했습니다: ${G.boss.n}`,all?"모든 게이트를 클리어했습니다. S급 게이트가 열립니다.":`남은 게이트 ${DOMS.length-S.dojo.cleared.length}개`],fin?"레벨 업":"게이트 클리어"),300);
  goTop();
}

function startSurv(){

  G.q=toQ(G.queue[0]);survQ();
}
function survQ(){
  const q=G.q;
  app.innerHTML=`<div class="arena"><div class="plrow"><span class="hearts big">${"❤️".repeat(G.hearts)}${"🖤".repeat(3-G.hearts)}</span><span class="score">🏅 ${G.score}문제</span></div>
   <div class="items"><button class="item" id="ff" ${G.fifty&&!q.r&&q.o.length===4?"":"disabled"}>✂️ 50:50 ×${G.fifty}</button><span class="item ghost">💖 부활 ×${G.revive}</span><span class="muted" style="margin-left:auto">최고 ${S.rec.surv}문제</span></div></div>`+
   qCard(q,q.r,{counter:`${G.i+1}번째`,hidden:G.hidden,nextLabel:G.hearts===0?"게임 오버…":"다음 →"});
  on("ff",()=>{if(!G.fifty)return;G.fifty--;G.hidden=new Set(shuf([0,1,2,3].filter(k=>k!==q.a)).slice(0,2));survQ()});
  bindQ(k=>{q.pick=k;q.r=judge(q,k);if(q.r==="ok"){G.score++;setTimeout(()=>floatText("+1","#3ddc97"),30)}else{G.hearts--;shake();buzz([60,40,60])}survQ()},survNext);
}
function survNext(){
  if(G.hearts===0)return survOver();
  G.i++;G.hidden=new Set();if(G.i>=G.queue.length){G.queue=shuf(G.queue.slice());G.i=0}
  G.q=toQ(G.queue[G.i]);survQ();goTop();
}
function survOver(){
  const rec=G.score>S.rec.surv;if(rec){S.rec.surv=G.score;save()}
  app.innerHTML=`<div class="card hero"><div style="font-size:3.4rem">💀</div><h1>던전 브레이크 종료</h1>
   <p><b style="font-size:1.6rem;color:var(--ink)">${G.score}문제</b> 버텼어요${rec?" · <b style='color:var(--gold)'>신기록!</b>":` (최고 ${S.rec.surv})`}</p>
   <div class="nav" style="justify-content:center;gap:8px;flex-wrap:wrap">

}

const TA_N=20,TA_SEC=20;
function startTA(){G={mode:"ta",qs:pickIds(ALL,TA_N).map(toQ),i:0,score:0,ok:0,left:TA_SEC};taQ(true)}
function taQ(fresh){
  clearInterval(timer);const q=G.qs[G.i];
  if(fresh){G.left=TA_SEC;G.t0=Date.now()}
  app.innerHTML=`<div class="arena"><div class="plrow"><span class="score">⏱️ ${G.i+1} / ${TA_N}</span><span class="score">⭐ ${G.score}점</span><span class="muted">최고 ${S.rec.ta}</span></div>
   <div class="timer"><i id="tbar" style="width:${G.left/TA_SEC*100}%"></i></div><div class="tleft" id="tleft">${q.r?"":Math.ceil(G.left)+"초"}</div></div>`+
   qCard(q,q.r,{gain:q.gain,noIdk:true,nextLabel:G.i===TA_N-1?"결과 보기":"다음 →"});
  bindQ(k=>taPick(k),()=>{if(G.i===TA_N-1)taEnd();else{G.i++;taQ(true);goTop()}});
  if(!q.r){timer=setInterval(()=>{G.left=TA_SEC-(Date.now()-G.t0)/1000;const b=document.getElementById("tbar"),t=document.getElementById("tleft");
    if(b){b.style.width=Math.max(0,G.left/TA_SEC*100)+"%";b.style.background=G.left<5?"var(--ng)":""}if(t)t.textContent=Math.max(0,Math.ceil(G.left))+"초";
    if(G.left<=0){q.timeout=true;taPick(-2)}},100)}
}
function taPick(k){
  clearInterval(timer);const q=G.qs[G.i];if(q.r)return;q.pick=k;
  q.r=judge(q,k);if(k===-2)q.r="ng";
  if(q.r==="ok"){const pts=100+Math.max(0,Math.round(G.left))*10;G.score+=pts;G.ok++;q.gain=`+${pts}점`;setTimeout(()=>floatText(`+${pts}`,"#ffc94d"),30)}else shake();
  taQ(false);
}
function taEnd(){
  clearInterval(timer);const rec=G.score>S.rec.ta;if(rec){S.rec.ta=G.score;save()}
  app.innerHTML=`<div class="card hero"><div style="font-size:3.4rem">⏱️</div><h1>${G.score}점</h1>
   <p>${TA_N}문제 중 ${G.ok}개 정답${rec?" · <b style='color:var(--gold)'>신기록!</b>":` (최고 ${S.rec.ta}점)`}</p>
   <p class="muted">정답 100점 + 남은 시간 1초당 10점</p>
   <div class="nav" style="justify-content:center;gap:8px"><button class="btn" id="again">다시 도전</button><button class="btn ghost" id="lb">로비로</button></div></div>`;
  on("again",startTA);on("lb",lobby);goTop();
}

function rvEnd(){
  const g=G.qs.filter(q=>q.r==="ok").length;
  app.innerHTML=`<div class="card hero"><div style="font-size:3.4rem">🔓</div><h1>${g}문제 탈출</h1><p>${G.qs.length}문제 중 ${g}개를 맞혀 패널티 존에서 풀려났어요. 남은 수감 ${wrong.size}문제.</p>
   <div class="nav" style="justify-content:center;gap:8px">${wrong.size?`<button class="btn" id="again">한 번 더</button>`:""}<button class="btn ghost" id="lb">로비로</button></div></div>`;
  on("again",startReview);on("lb",lobby);goTop();
}

// ===================== 📖 도감 =====================
function showCodex(){
  app.innerHTML=`<div class="arena"><div class="plrow"><span class="score">🌑 그림자 군단</span><span class="score">${codex.size} / ${QB.length}</span></div>
   <div class="lpbar" style="max-width:none"><i style="width:${codex.size/QB.length*100}%"></i></div><p class="muted" style="margin:6px 0 0">문제를 맞히면 그림자를 추출해 군단에 합류시켜요. 그림자를 누르면 해설을 다시 볼 수 있어요.</p></div>
   ${DOMS.map(d=>{const ids=idsOf(d),got=ids.filter(i=>codex.has(i)).length;return `<div class="card"><div class="cxhead"><span>${BOSS[d].e} <b>${d}</b></span><span class="muted">${got}/${ids.length}${got===ids.length?" · 👑 군단 완성":""}</span></div>
     <div class="cards">${ids.map(i=>codex.has(i)?`<button class="cx on" data-i="${i}">${esc(QB[i].a.length>26?QB[i].a.slice(0,25)+"…":QB[i].a)}</button>`:`<span class="cx">?</span>`).join("")}</div></div>`}).join("")}
   <div id="modal"></div><div class="nav" style="justify-content:center"><button class="btn ghost" id="lb">로비로</button></div>`;
  on("lb",lobby);
  app.querySelectorAll(".cx.on").forEach(b=>b.onclick=()=>{const x=QB[+b.dataset.i];document.getElementById("modal").innerHTML=`<div class="modal" id="mbg"><div class="card mcard"><div class="meta"><span class="tag">${x.d}</span></div><p class="q">${esc(x.q)}</p><p class="a" style="color:var(--ok);font-weight:700">✔ ${esc(x.a)}</p><p class="muted" style="font-size:.92rem">${esc(x.e)}</p><div class="nav"><button class="btn" id="mx">닫기</button></div></div></div>`;
    on("mx",()=>document.getElementById("modal").innerHTML="");document.getElementById("mbg").onclick=e=>{if(e.target.id==="mbg")document.getElementById("modal").innerHTML=""}});
  goTop();
}

// ===================== 설치(PWA) =====================
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;showInstallHint()});
function showInstallHint(){
  const el=document.getElementById("inst");if(!el)return;
  const standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
  if(standalone||store.get("pt_hide_inst",false))return;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(deferredPrompt){el.style.display="block";el.innerHTML=`📲 홈 화면에 앱으로 설치할 수 있어요. <button class="btn tiny" id="instgo">설치</button> <button class="btn ghost tiny" id="instx">닫기</button>`;
    on("instgo",async()=>{deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(_){}deferredPrompt=null;el.style.display="none"})}
  else if(ios&&location.protocol==="https:"){el.style.display="block";el.innerHTML=`📲 Safari 아래쪽 <b>공유 버튼</b> → <b>홈 화면에 추가</b>를 누르면 앱처럼 쓸 수 있어요. <button class="btn ghost tiny" id="instx">닫기</button>`}
  else return;
  on("instx",()=>{store.set("pt_hide_inst",true);el.style.display="none"});
}
if("serviceWorker" in navigator&&location.protocol==="https:"&&window.self===window.top){navigator.serviceWorker.register("sw.js").catch(()=>{})}
initAccount();
lobby();

</script>
