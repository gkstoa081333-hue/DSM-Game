<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10121a">
<meta name="description" content="정신건강전문요원 수련 필기 대비 정신의학·DSM-5 랭크전 퀴즈">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DSM 랭크전">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>정신의학·DSM-5 랭크전</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#10121a;--card:#1b1f2e;--card2:#252a3d;--ink:#eef0f6;--sub:#9aa1b5;--line:#323850;--acc:#7c6cff;--gold:#ffc94d;--ok:#3ddc97;--ng:#ff6b6b}
*{box-sizing:border-box}
html{background:#10121a;-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{margin:0;background:radial-gradient(circle at 50% -10%,#2b2452,var(--bg) 55%);background-attachment:fixed;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.card.small{padding:14px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.96)}.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--sub)}
.btn.big{font-size:1.08rem;padding:13px 28px}.btn.tiny{font-size:.78rem;padding:6px 12px}
.promo-btn{background:linear-gradient(135deg,#ffc94d,#ff7b4d);color:#2a1a00;animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 22px rgba(255,201,77,.6)}}
.muted{color:var(--sub);font-size:.85rem}
/* rank */
.rankcard{text-align:center;background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--tc) 22%,var(--card)),var(--card) 70%);border-color:color-mix(in srgb,var(--tc) 45%,var(--line))}
.emblem{margin:0 auto;border-radius:24%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--tc) 70%,#fff),var(--tc) 55%,color-mix(in srgb,var(--tc) 50%,#000));box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 40%,transparent),0 8px 26px color-mix(in srgb,var(--tc) 40%,transparent);transform:rotate(45deg)}
.emblem{line-height:1}.emblem::before{content:none}
.emblem>*{transform:rotate(-45deg)}
.rk-name{font-size:1.6rem;font-weight:900;margin-top:14px;color:var(--tc)}
.rk-sub{color:var(--sub);font-size:.9rem}
.lpbar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px auto 0;max-width:360px}
.lpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff9d4d);transition:width .6s}
.ladder{display:flex;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.ladder span{display:flex;flex-direction:column;align-items:center;font-size:1.2rem;padding:6px 8px;border-radius:12px;opacity:.35;min-width:58px}
.ladder span small{font-size:.66rem;color:var(--sub)}
.ladder span.done{opacity:.75}.ladder span.on{opacity:1;background:color-mix(in srgb,var(--tc) 20%,transparent);outline:1.5px solid var(--tc)}
.promo-btn.big{margin-top:14px}
/* modes */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:transform .1s,border-color .2s}
.mode:hover:not(:disabled){border-color:var(--acc)}.mode:active:not(:disabled){transform:scale(.97)}
.mode:disabled{opacity:.45;cursor:default}
.mode.main{grid-column:1/-1;background:linear-gradient(135deg,#3a2f8f,#5a2f8f);border-color:#6d5cff}
.mode .mi{font-size:1.6rem}.mode b{font-size:1.02rem}.mode small{color:var(--sub);font-size:.8rem}
.mode.main small{color:#d7d0ff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--card2);border-radius:12px;padding:9px 4px;text-align:center}
.stats b{display:block;font-size:1.15rem}.stats small{color:var(--sub);font-size:.7rem}
details{margin-top:12px}summary{cursor:pointer;color:var(--sub);font-size:.9rem}
.rules{font-size:.86rem;padding-left:18px}
/* arena */
.arena{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;position:sticky;top:calc(6px + env(safe-area-inset-top));z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.arena.promo{background:linear-gradient(135deg,#3b2a10,#1b1f2e);border-color:#ffc94d;text-align:center;position:static}
.promo-title{font-weight:900;font-size:1.3rem;color:var(--gold)}
.bossrow{display:flex;gap:14px;align-items:center}
.bossemoji{font-size:3rem;width:70px;height:70px;display:flex;align-items:center;justify-content:center;background:var(--card2);border-radius:18px;flex:none}
.bossemoji.hit{animation:hit .4s}.bossemoji.dead{filter:grayscale(1);opacity:.5}
@keyframes hit{20%{transform:translateX(-8px) rotate(-8deg);background:#5a2030}60%{transform:translateX(6px) rotate(5deg)}}
.bossinfo{flex:1;min-width:0}
.bossname{font-weight:900}.bossdom{font-size:.78rem;color:var(--sub)}
.hp{height:12px;background:#3a2030;border-radius:99px;overflow:hidden;margin-top:4px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff4d6d,#ff9d4d);transition:width .45s}
.hpt{font-size:.75rem;color:var(--sub);margin-top:2px}
.plrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.arena>.plrow:first-child{margin-top:0}
.hearts{font-size:1.05rem;letter-spacing:1px}.hearts.big{font-size:1.4rem}
.combo{font-weight:900;color:var(--sub)}.combo.hot{color:#ff9d4d}
.lpd{font-weight:900}.lpd.up{color:var(--ok)}.lpd.down{color:var(--ng)}
.score{font-weight:900}
.pips{display:flex;gap:6px;margin-top:10px}
.pips span{flex:1;text-align:center;background:var(--card2);border-radius:10px;padding:3px 0;font-size:1rem;opacity:.4}
.pips span.now{opacity:1;outline:1.5px solid var(--acc)}.pips span.ok{opacity:1;background:rgba(61,220,151,.18)}.pips span.ng{opacity:.8;background:rgba(255,107,107,.18)}
.pips.big span{font-weight:900;padding:8px 0;opacity:1}
.items{display:flex;gap:8px;align-items:center;margin-top:10px}
.item{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.item:disabled{opacity:.4;cursor:default}.item.ghost{cursor:default;color:var(--sub)}
.timer{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--gold))}
.tleft{text-align:right;font-weight:900;font-size:.85rem;margin-top:2px}
/* question */
.meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--sub);margin-bottom:8px}
.tag{background:var(--card2);color:#c9c2ff;padding:2px 10px;border-radius:99px}
.q{font-size:1.06rem;font-weight:700;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:2px solid transparent;border-radius:12px;padding:12px 14px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:rgba(61,220,151,.13)}.opt.ng{border-color:var(--ng);background:rgba(255,107,107,.13)}
.opt.gone{opacity:.25}
.idkbtn{width:100%;background:transparent;border:2px dashed var(--line);color:var(--sub);border-radius:12px;padding:10px;font:inherit;cursor:pointer}
.idkbtn:hover:not(:disabled){color:var(--ink);border-color:#8a93a8}.idkbtn:disabled{opacity:.35}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card2);font-size:.92rem}
.fb .h{font-weight:900;margin-bottom:2px}.fb.ok .h{color:var(--ok)}.fb.ng .h{color:var(--ng)}.fb.idk .h{color:#c4cad8}
.gain{color:var(--gold);font-weight:700;margin-left:8px;font-size:.88rem}
.nav{display:flex;justify-content:flex-end;margin-top:12px}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.float{position:fixed;left:50%;top:36%;transform:translateX(-50%);font-weight:900;font-size:1.7rem;color:var(--gold);pointer-events:none;animation:fl 1.1s forwards;z-index:50;text-shadow:0 2px 14px rgba(0,0,0,.6);white-space:nowrap}
@keyframes fl{0%{opacity:0;transform:translate(-50%,12px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px)}}
/* result */
.hero{text-align:center;padding:24px 18px}.hero h1{font-weight:900;font-size:1.6rem;margin:10px 0 4px}.hero h2{margin:6px 0}
.celebrate{border-color:var(--gold);box-shadow:0 0 40px rgba(255,201,77,.25)}
.bosslist{display:flex;justify-content:center;gap:8px;margin:14px 0}
.bosslist span{display:flex;flex-direction:column;align-items:center;font-size:1.8rem;background:var(--card2);border-radius:14px;padding:6px 8px;min-width:54px}
.bosslist span small{font-size:.68rem;font-weight:700}.bosslist .ok small{color:var(--ok)}.bosslist .ng{opacity:.55}.bosslist .ng small{color:var(--ng)}
.rkchange{display:flex;justify-content:center;align-items:center;gap:18px;margin:16px 0 6px}
.rkchange>div{display:flex;flex-direction:column;align-items:center;gap:10px}
.rkchange small{font-size:.8rem;font-weight:700}
.rkchange .arrow{font-weight:900;font-size:.95rem;line-height:1.3}.arrow.up{color:var(--ok)}.arrow.down{color:var(--ng)}
.rkchange.small{margin:8px 0}
.event{margin:8px auto 0;max-width:340px;padding:8px 12px;border-radius:12px;font-weight:900}
.event.up{background:rgba(61,220,151,.15);color:var(--ok)}.event.down{background:rgba(255,107,107,.15);color:var(--ng)}.event.promo{background:rgba(255,201,77,.15);color:var(--gold)}
.row{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:.86rem;margin:8px 0}
.row .b{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}.row .b i{display:block;height:100%}
.wrong{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;font-size:.9rem}.wrong .a{color:var(--ok);font-weight:700}
pre{white-space:pre-wrap;font-size:.8rem;background:var(--card2);padding:10px;border-radius:10px;font-family:inherit}
/* codex */
.cxhead{display:flex;justify-content:space-between;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cx{display:flex;align-items:center;justify-content:center;text-align:center;min-height:62px;border-radius:12px;background:var(--card2);color:#4a5068;font-weight:900;font-size:1.2rem;border:1px dashed var(--line);padding:6px}
.cx.on{background:linear-gradient(135deg,#2e2a5a,#3b2f6e);color:var(--ink);font-size:.8rem;font-weight:700;border:1px solid #6d5cff;cursor:pointer;font-family:inherit}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.mcard{max-width:520px;width:100%}

@media (max-width:520px){
 body{font-size:15px}
 .card{padding:14px;border-radius:16px}
 .arena{padding:10px 12px;border-radius:16px}
 .bossemoji{width:52px;height:52px;font-size:2.2rem;border-radius:14px}
 .bossrow{gap:10px}.bossname{font-size:.92rem}
 .plrow{margin-top:6px}.pips{margin-top:6px}.pips span{font-size:.85rem}
 .q{font-size:1rem}
 .opt{padding:13px 12px;font-size:.95rem;min-height:48px}
 .idkbtn{min-height:44px}
 .modes{gap:8px}.mode{padding:12px}.mode .mi{font-size:1.4rem}
 .stats b{font-size:1rem}
 .rk-name{font-size:1.4rem}
 .ladder span small{font-size:.6rem}
 .rkchange{gap:10px}
 .nav .btn{min-height:46px}
 #next{width:100%}
}
@media (max-height:700px) and (max-width:520px){.arena{position:static}}
.install{display:none;margin-top:10px;font-size:.82rem;color:var(--sub);background:var(--card2);border-radius:12px;padding:10px;text-align:left}
textarea{width:100%;min-height:90px;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:.75rem}
@media (max-width:420px){.row{grid-template-columns:110px 1fr 36px}.ladder span{min-width:52px;padding:5px}}
</style>
</head>
<body><div class="wrap" id="app"></div>
<script>
// 형식: [영역, 문제, [정답, 오답1, 오답2, 오답3], 해설]  (보기는 실행 때 섞임)
const D1="DSM-5 체계",D2="조현병 스펙트럼",D3="기분장애",D4="불안·강박·외상",D5="성격장애",D6="신경인지·물질",D7="치료",D8="자살·지역사회·법",D9="이론·정신병리·역사",D10="신체·해리·섭식·수면·아동";
const BANK=[
// ── D1 DSM-5 체계
[D1,"DSM-IV에서 DSM-5로 바뀐 내용으로 옳지 않은 것은?",["'기분장애' 범주를 새로 만들어 양극성장애와 우울장애를 묶음","판수를 로마 숫자 대신 아라비아 숫자로 표기","다축 진단체계 폐기","'스펙트럼', '관련 장애' 같은 차원적 접근 도입"],"반대로 바뀌었어요. 기분장애 범주가 없어지고 '양극성 및 관련 장애'와 '우울장애'로 나뉘었습니다."],
[D1,"DSM-5에서 '강박 및 관련 장애'에 속하지 않는 것은?",["질병불안장애","신체이형장애","저장장애","피부뜯기장애"],"질병불안장애(옛 건강염려증)는 '신체증상 및 관련 장애'에 속해요."],
[D1,"DSM-5에서 '외상 및 스트레스 관련 장애'에 속하는 것은?",["반응성 애착장애","분리불안장애","선택적 함구증","범불안장애"],"반응성 애착장애와 탈억제 사회관여장애가 여기에 들어갔어요. 분리불안장애와 선택적 함구증은 불안장애로 옮겨졌습니다."],
[D1,"DSM-IV의 '병적 도박'은 DSM-5에서 어느 범주로 옮겨졌나?",["물질관련 및 중독장애(도박장애)","파괴적, 충동조절 및 품행장애","강박 및 관련 장애","성격장애"],"'도박장애'라는 이름으로 중독장애에 들어간 첫 행위중독이에요."],
[D1,"DSM-5에서 '해리성 둔주'는 어떻게 바뀌었나?",["해리성 기억상실의 명시자로 통합","독립 진단으로 유지","이인증/비현실감 장애로 통합","전환장애로 이동"],"'해리성 둔주 동반'이라는 명시자로 해리성 기억상실에 들어갔어요."],
[D1,"DSM-5 '신경발달장애'에 속하지 않는 것은?",["분리불안장애","자폐스펙트럼장애","주의력결핍 과잉행동장애","특정학습장애"],"분리불안장애는 불안장애예요. 신경발달장애는 지적장애, 의사소통장애, 자폐스펙트럼, ADHD, 특정학습장애, 운동장애입니다."],
[D1,"DSM-5 우울장애 범주에 새로 추가된 장애는?",["파괴적 기분조절부전장애","순환성장애","기분부전장애","계절성 정동장애"],"파괴적 기분조절부전장애와 월경전불쾌감장애가 새로 들어갔어요. 순환성장애는 양극성 및 관련 장애입니다."],
[D1,"DSM-IV의 아스퍼거장애는 DSM-5에서 어떻게 되었나?",["자폐스펙트럼장애로 통합","독립 진단으로 유지","사회적(실용적) 의사소통장애로 이름만 바뀜","성격장애로 이동"],"자폐장애, 아스퍼거장애, 소아기붕괴성장애 등이 자폐스펙트럼장애 하나로 묶였어요. 사회적(실용적) 의사소통장애는 따로 새로 만든 진단입니다."],
[D1,"DSM-5 '신체증상 및 관련 장애'에 속하는 것은?",["허위성장애","신체이형장애","해리성 기억상실","저장장애"],"신체증상장애, 질병불안장애, 전환장애, 허위성장애 등이 여기에 속해요. 신체이형장애는 강박 및 관련 장애로 옮겨졌습니다."],
[D1,"DSM-5에서 '치매'를 대신하는 공식 진단명은?",["주요 신경인지장애","기질성 정신장애","달리 분류되지 않는 인지장애","만성 섬망"],"주요 신경인지장애와 함께 '경도 신경인지장애'가 새로 생겼어요."],
[D1,"DSM-IV의 '성정체감장애'는 DSM-5에서 어떻게 되었나?",["'성별 불쾌감'으로 이름이 바뀌고 별도 범주가 됨","성기능부전에 통합","변태성욕장애로 이동","삭제"],"정체성 자체가 아니라 그로 인한 고통(불쾌감)에 초점을 맞추도록 이름이 바뀌었어요."],
[D1,"DSM-IV 부록에 있다가 DSM-5에서 정식 진단이 된 섭식장애는?",["폭식장애","신경성 폭식증","신경성 식욕부진증","이식증"],"폭식장애(binge-eating disorder)는 보상행동 없이 폭식이 반복되는 장애로, DSM-5에서 정식 진단이 되었어요."],
[D1,"발모광(모발뽑기장애)은 DSM-5에서 어느 범주에 속하나?",["강박 및 관련 장애","파괴적, 충동조절 및 품행장애","신체증상 및 관련 장애","불안장애"],"DSM-IV에서는 충동조절장애였는데, DSM-5에서 강박 및 관련 장애로 옮겨졌어요."],
// ── D2 조현병 스펙트럼
[D2,"DSM-5 조현병의 5가지 핵심 증상에 해당하지 않는 것은?",["강박사고","망상","환각","음성증상"],"5가지 핵심 증상은 망상, 환각, 와해된 언어, 와해되거나 긴장증적인 행동, 음성증상이에요."],
[D2,"망상과 환청이 2개월째 이어지는 환자의 가장 적절한 진단은?",["조현양상장애","단기 정신병적 장애","조현병","망상장애"],"1일~1개월 미만이면 단기 정신병적 장애, 1개월~6개월 미만이면 조현양상장애, 6개월 이상이면 조현병이에요."],
[D2,"다음 중 조현병의 음성증상은?",["정동 둔마","피해망상","환청","지리멸렬한 언어"],"음성증상은 정상 기능이 줄어들거나 사라지는 것이에요(정동 둔마, 무언증, 무의욕, 무쾌감)."],
[D2,"Bleuler의 조현병 기본 증상(4A)에 해당하지 않는 것은?",["환각(Hallucination)","연상 이완(Association)","정동 장애(Affect)","양가감정(Ambivalence)"],"4A는 연상 이완, 정동 장애, 양가감정, 자폐성(Autism)이에요. Bleuler는 환각·망상을 부수 증상으로 봤습니다."],
[D2,"Schneider의 1급 증상에 해당하는 것은?",["사고 전파","정동 둔마","연상 이완","긴장증"],"사고 전파, 사고 투입, 사고 탈취, 논평하는 환청, 조종망상 등이 1급 증상이에요."],
[D2,"조현병 도파민 가설에서 양성증상과 관련된 경로는?",["중뇌변연계 도파민 과활성","중뇌피질계 도파민 과활성","흑질선조체 도파민 과활성","결절누두 도파민 과활성"],"양성증상은 중뇌변연계 과활성, 음성·인지 증상은 중뇌피질계 저활성과 관련돼요. 흑질선조체 차단은 추체외로 부작용, 결절누두 차단은 고프로락틴혈증을 일으킵니다."],
[D2,"조현병에서 예후가 좋은 요인은?",["급성 발병과 뚜렷한 유발 요인","어린 나이 발병","음성증상 우세","서서히(잠행성) 발병"],"늦은 발병, 급성 발병, 뚜렷한 유발 요인, 기분 증상 동반, 좋은 병전 기능이 좋은 예후 요인이에요."],
[D2,"조현정동장애 진단에 꼭 필요한 조건은?",["기분 삽화 없이 망상이나 환각만 2주 이상 있었던 기간","정신병 증상이 기분 삽화 중에만 나타남","망상만 6개월 이상","증상 지속 1개월 미만"],"기분 삽화 중에만 정신병 증상이 있으면 정신병적 양상을 동반한 기분장애로 봐요."],
[D2,"망상장애에 대한 설명으로 옳은 것은?",["망상이 1개월 이상 지속되고 망상 외 기능은 비교적 유지됨","뚜렷한 환청이 주된 증상","음성증상이 6개월 이상 두드러짐","반드시 기분 삽화를 동반"],"망상과 관련된 부분 말고는 행동이 눈에 띄게 이상하지 않은 경우가 많아요."],
[D2,"조현병 역학에 대한 설명으로 옳은 것은?",["남성이 여성보다 발병 나이가 이르다","여성이 남성보다 발병 나이가 이르다","평생유병률은 약 10%다","노년기 발병이 가장 흔하다"],"평생유병률은 약 1%예요. 남성은 10대 후반~20대 중반, 여성은 20대 후반~30대 초반에 주로 발병합니다."],
// ── D3 기분장애
[D3,"제II형 양극성장애의 진단 조건으로 옳은 것은?",["주요우울 삽화 1회 이상 + 경조증 삽화 1회 이상, 조증 삽화는 없음","조증 삽화 1회 이상","경조증과 경도 우울 증상이 2년 이상 반복","주요우울 삽화만 반복"],"조증 삽화가 한 번이라도 있으면 제I형이에요."],
[D3,"주요우울 삽화의 진단 기준으로 옳은 것은?",["증상 5개 이상, 2주 이상(우울 기분이나 흥미 상실 중 1개 포함)","증상 3개 이상, 1주 이상","증상 5개 이상, 1개월 이상","증상 2개 이상, 2년 이상"],"9개 증상 중 5개 이상이 2주 이상 거의 매일 나타나야 해요."],
[D3,"성인의 지속성 우울장애(기분부전증) 진단에 필요한 최소 기간은?",["2년","6개월","1년","5년"],"성인은 2년, 아동·청소년은 1년이에요."],
[D3,"조증 삽화 진단에 필요한 최소 기간은? (입원이 필요한 경우는 제외)",["1주","4일","2주","2일"],"조증은 1주 이상(입원이 필요하면 기간과 관계없음), 경조증은 4일 이상이에요."],
[D3,"리튬의 부작용이 아닌 것은?",["무과립구증","갑상선기능저하증","손 떨림","다뇨(신성 요붕증)"],"무과립구증은 클로자핀, 카바마제핀에서 주의해야 해요. 리튬은 치료 범위가 좁아서 혈중농도를 확인해야 합니다."],
[D3,"리튬 독성 위험을 높이는 것은?",["NSAIDs나 티아지드 이뇨제 병용, 탈수","소금을 많이 먹는 식사","수분 섭취 늘리기","카페인 섭취"],"나트륨이 부족하거나 탈수가 되면 신장에서 리튬이 다시 흡수돼 혈중농도가 올라가요."],
[D3,"DSM-5에서 '계절성 우울'은 어떻게 다루나?",["우울 삽화의 '계절성 동반' 명시자","독립된 진단","적응장애의 하위유형","양극성장애에만 붙는 명시자"],"주요우울장애와 양극성장애의 우울 삽화 모두에 붙일 수 있는 명시자예요."],
[D3,"월경전불쾌감장애는 DSM-5에서 어느 범주에 속하나?",["우울장애","불안장애","신체증상 및 관련 장애","성기능부전"],"DSM-5에서 우울장애 범주에 정식 진단으로 들어갔어요."],
[D3,"성인 순환성장애 진단에 필요한 최소 기간은?",["2년","1년","6개월","4일"],"경조증 증상과 우울 증상이 번갈아 나타나는 기간이 성인 2년(아동·청소년 1년) 이상이어야 하고, 어느 쪽도 삽화 기준은 충족하지 않아야 해요."],
[D3,"우울증의 모노아민 가설에서 기능이 떨어져 있다고 보는 신경전달물질은?",["세로토닌과 노르에피네프린","도파민 과다","GABA 과다","글루타메이트 과다"],"대부분의 항우울제가 세로토닌이나 노르에피네프린을 늘리는 방식으로 작용해요."],
[D3,"'멜랑콜리아 양상 동반' 우울의 특징은?",["아침에 더 심하고 새벽에 일찍 깸","과식과 과다수면","거절에 대한 민감성","좋은 일에는 기분이 나아짐"],"나머지 세 보기는 '비전형적 양상'의 특징이에요."],
// ── D4 불안·강박·외상
[D4,"교통사고 2주 뒤 침투적 기억, 회피, 과각성이 나타난 경우 가장 적절한 진단은?",["급성 스트레스장애","외상후 스트레스장애","적응장애","범불안장애"],"외상 후 3일~1개월 사이면 급성 스트레스장애, 1개월을 넘기면 PTSD예요."],
[D4,"범불안장애 진단에 필요한 최소 증상 지속 기간은?",["6개월","2주","1개월","3개월"],"조절하기 어려운 과도한 걱정이 6개월 이상, 걱정하는 날이 그렇지 않은 날보다 많아야 해요."],
[D4,"공황발작의 특징으로 옳은 것은?",["갑작스러운 극심한 공포가 몇 분 안에 최고조에 이름","몇 시간에 걸쳐 서서히 심해짐","최소 2주 동안 이어짐","하루 종일 일정하게 유지됨"],"13개 증상 중 4개 이상이 몇 분 안에 최고조에 이르러요."],
[D4,"공황장애 진단에 필요한 조건은?",["예상치 못한 공황발작이 반복되고, 그 뒤 1개월 이상 걱정하거나 행동이 바뀜","공황발작 1회","공황발작 후 6개월 이상 걱정","특정 상황에서만 일어나는 공황발작"],"추가 발작이나 그 결과를 계속 걱정하거나, 발작을 피하려고 행동이 크게 바뀌어야 해요."],
[D4,"DSM-5에서 광장공포증은 어떻게 바뀌었나?",["공황장애와 별개인 독립 진단","공황장애의 하위유형","사회불안장애의 하위유형","특정공포증의 하위유형"],"DSM-IV에서는 공황장애와 묶여 있었는데, DSM-5에서 따로 진단해요."],
[D4,"강박장애의 1차 약물치료는?",["SSRI(비교적 고용량, 장기간)","벤조디아제핀 단독","리튬","메틸페니데이트"],"SSRI나 클로미프라민을 쓰고, 노출 및 반응방지(ERP)를 함께 하는 게 표준이에요."],
[D4,"강박장애에서 주로 쓰이는 방어기제가 아닌 것은?",["분리(splitting)","격리","취소","반동형성"],"강박장애는 격리, 취소, 반동형성이 대표적이에요. 분리는 경계성 성격장애의 특징입니다."],
[D4,"DSM-5 PTSD 증상군 4가지에 포함되지 않는 것은?",["공황발작","침투 증상","회피","인지와 기분의 부정적 변화"],"4가지 증상군은 침투, 회피, 인지·기분의 부정적 변화, 각성과 반응성의 변화예요."],
[D4,"PTSD의 1차 치료로 가장 근거가 많은 것은?",["외상 초점 인지행동치료(지속노출 등)","벤조디아제핀 장기 단독 사용","전기경련요법","항정신병 약물 단독"],"외상 초점 심리치료(지속노출, 인지처리치료, EMDR)와 SSRI가 1차 치료예요. 벤조디아제핀은 권장하지 않습니다."],
[D4,"특정공포증 중 '혈액-주사-손상형'의 특징은?",["심박과 혈압이 떨어지며 기절할 수 있음","빈맥만 나타나고 기절하지 않음","주로 노년기에 시작","치료 없이도 바로 사라짐"],"처음엔 맥박이 빨라졌다가 곧 미주신경 반응으로 맥박과 혈압이 떨어져 기절하는 특징이 있어요."],
[D4,"DSM-5 분리불안장애에 대한 설명으로 옳은 것은?",["성인도 진단할 수 있음(아동 4주, 성인 보통 6개월 이상)","18세 이전에만 진단 가능","외상 관련 장애로 분류","증상 2주면 진단 가능"],"DSM-5에서 불안장애로 옮겨지면서 발병 나이 제한이 없어졌어요."],
// ── D5 성격장애
[D5,"A군(이상하고 괴짜 같은) 성격장애에 속하는 것은?",["조현형 성격장애","경계성 성격장애","회피성 성격장애","연극성 성격장애"],"A군은 편집성·조현성·조현형, B군은 반사회성·경계성·연극성·자기애성, C군은 회피성·의존성·강박성이에요."],
[D5,"분리(splitting) 방어기제가 특징적인 성격장애는?",["경계성","강박성","조현성","의존성"],"치료자를 이상화했다가 금세 평가절하하는 형태로도 나타나요."],
[D5,"성격장애 일반 진단 기준에 대한 설명으로 옳은 것은?",["패턴이 청소년기나 성인기 초기에 시작되어 오래 지속됨","40대 이후 처음 나타남","특정 스트레스 후 6개월 안에 사라짐","한 가지 상황에서만 나타남"],"여러 상황에서 일관되게 나타나는 오래된 패턴이어야 해요."],
[D5,"반사회성 성격장애 진단 조건으로 옳은 것은?",["만 18세 이상이고, 15세 이전에 품행장애 증거가 있음","15세 이상이면 진단 가능","아동기 ADHD 진단이 반드시 필요","증상이 2년 이상 지속"],"18세 미만은 품행장애로 진단해요."],
[D5,"C군(불안하고 두려워하는) 성격장애에 속하는 것은?",["의존성 성격장애","자기애성 성격장애","편집성 성격장애","연극성 성격장애"],"C군은 회피성, 의존성, 강박성이에요."],
[D5,"친밀한 관계를 원하지만 거절이 두려워 사람을 피하는 성격장애는?",["회피성","조현성","편집성","반사회성"],"조현성은 관계 자체에 관심이 없다는 점에서 회피성과 달라요."],
[D5,"경계성 성격장애에 근거가 가장 많은 심리치료는?",["변증법적 행동치료(DBT)","자유연상 중심 고전적 정신분석","체계적 둔감법","전기경련요법"],"Linehan이 만든 DBT는 정서조절, 고통감내, 대인관계, 마음챙김 기술을 훈련해요."],
[D5,"마술적 사고, 관계사고, 기이한 지각 경험과 말투가 특징인 성격장애는?",["조현형","조현성","편집성","연극성"],"조현형 성격장애는 DSM-5에서 조현병 스펙트럼에도 함께 올라가 있어요."],
[D5,"늘 관심의 중심이 되려 하고, 감정 표현이 피상적이며 자주 바뀌는 성격장애는?",["연극성","자기애성","경계성","의존성"],"자기애성은 웅대함과 공감 부족, 경계성은 불안정한 관계와 충동성이 핵심이에요."],
[D5,"강박성 성격장애의 핵심 특징은?",["완벽주의, 질서, 통제에 대한 집착","침투적인 강박사고와 반복되는 의식 행동","물건을 버리지 못하고 쌓아둠","신체 결함에 대한 집착"],"강박장애와 달리 강박성 성격장애는 자기 성향을 문제로 느끼지 않는 경우가 많아요."],
// ── D6 신경인지·물질
[D6,"섬망을 치매와 구분하는 가장 중요한 특징은?",["급성 발병과 의식·주의 수준이 하루 중 변동","기억력 저하","언어장애","노인에게 흔함"],"치매는 서서히 진행하고 초기에는 의식이 맑아요."],
[D6,"DSM-5 알코올사용장애에서 11개 기준 중 6개 이상을 충족하면 심각도는?",["고도","경도","중등도","판단 불가"],"2~3개는 경도, 4~5개는 중등도, 6개 이상은 고도예요. 첨부하신 DSM-5 요약 자료에는 다르게 적혀 있으니 이 기준으로 고쳐 외우세요."],
[D6,"베르니케 뇌병증의 원인은?",["티아민(비타민 B1) 결핍","비타민 B12 결핍","엽산 결핍","나이아신 결핍"],"안구운동 이상, 운동실조, 혼돈이 3대 증상이에요. 포도당보다 티아민을 먼저 줘야 합니다."],
[D6,"코르사코프 증후군의 특징은?",["최근 기억장애와 작화증","환시와 진전","갑작스러운 의식 저하","강박적 반복 행동"],"베르니케 뇌병증 뒤에 오는 경우가 많고, 기억의 빈틈을 꾸며낸 이야기로 채워요(작화증)."],
[D6,"알코올 금단 섬망(진전섬망)이 가장 흔히 나타나는 시기는?",["마지막 음주 후 2~3일(48~72시간)","마지막 음주 후 6시간 안","마지막 음주 후 2주","마지막 음주 후 1개월"],"진전은 6~8시간, 환각은 12~24시간, 경련은 24~48시간, 진전섬망은 48~72시간 무렵에 흔해요."],
[D6,"알코올 금단 증상의 1차 치료 약물은?",["벤조디아제핀","항정신병 약물","날트렉손","디설피람"],"날트렉손과 디설피람은 금단이 끝난 뒤 재발을 막는 데 써요."],
[D6,"디설피람의 작용 원리는?",["알데히드 탈수소효소를 억제해 술을 마시면 불쾌한 반응이 생김","오피오이드 수용체 차단","GABA 작용 강화","NMDA 수용체 조절"],"아세트알데히드가 쌓여 얼굴 홍조, 구역, 두근거림이 생겨요. 본인 동의가 꼭 필요합니다."],
[D6,"아편계 약물 과다복용(동공 축소, 호흡 저하)의 해독제는?",["날록손","플루마제닐","디설피람","아캄프로세이트"],"플루마제닐은 벤조디아제핀 과다복용의 해독제예요."],
[D6,"알츠하이머병 치료에 1차로 쓰는 약물 계열은?",["아세틸콜린에스테라제 억제제(도네페질 등)","도파민 작용제","SSRI","리튬"],"중등도 이상에서는 NMDA 길항제인 메만틴도 써요."],
[D6,"알츠하이머병의 특징적인 병리 소견은?",["베타아밀로이드 판과 신경섬유매듭","루이소체","여러 군데의 뇌경색","흑질 퇴행"],"루이소체는 루이소체 치매·파킨슨병, 다발성 경색은 혈관성 치매와 관련돼요."],
[D6,"인지기능이 오락가락하고, 생생한 환시가 반복되며, 파킨슨 증상이 있는 치매는?",["루이소체 신경인지장애","알츠하이머병","전두측두엽 신경인지장애","혈관성 신경인지장애"],"항정신병 약물에 아주 민감해서 쓸 때 조심해야 해요."],
[D6,"DSM-5 물질사용장애 기준에서 바뀐 점으로 옳은 것은?",["남용과 의존을 하나로 합치고, '갈망'은 추가, '법적 문제'는 삭제","남용과 의존을 따로 유지","'내성'과 '금단' 기준 삭제","'갈망' 기준 삭제"],"11개 기준 중 몇 개를 충족하는지로 심각도를 정해요."],
[D6,"섬망 치료의 기본 원칙은?",["원인이 되는 신체 질환이나 약물을 찾아 바로잡는 것이 먼저","벤조디아제핀을 1차로 씀","신체 억제를 우선함","주변 자극을 완전히 없앰"],"교재에도 섬망은 감각 자극과 관련이 깊어 어느 정도 자극이 필요하다고 나와요. 벤조디아제핀은 알코올 금단 섬망이 아니면 오히려 악화시킬 수 있어요."],
// ── D7 치료
[D7,"항정신병 약물 복용 중 고열, 근육 강직, 자율신경 불안정이 나타났다. 진단과 첫 조치로 옳은 것은?",["신경이완제 악성 증후군 → 약물 즉시 중단 후 대증치료","추체외로 증상 → 항콜린제 추가","세로토닌 증후군 → SSRI 증량","지연성 운동장애 → 용량 증량"],"핵심 증상은 고열이에요. 용량과 관계없이 생길 수 있는 응급 상황입니다."],
[D7,"클로자핀에 대한 설명으로 옳은 것은?",["치료저항성 조현병에 쓰고, 무과립구증 위험이 있어 정기적으로 혈구검사가 필요","추체외로 부작용이 매우 흔함","음성증상에는 효과가 없음","1세대(정형) 항정신병 약물"],"양성·음성증상 모두에 효과가 있고, 추체외로 부작용은 거의 없어요."],
[D7,"전기경련요법(ECT)이 특히 효과적인 경우는?",["망상을 동반한 중증 우울증","경도 범불안장애","반사회성 성격장애","알코올 금단 초기"],"내인성 우울증, 망상을 동반한 우울증, 빠른 효과가 필요한 자살 고위험군에 효과적이에요."],
[D7,"오래 복용한 뒤 입, 혀, 얼굴에 불수의 운동이 나타나는 항정신병 약물 부작용은?",["지연성 운동장애","급성 근긴장이상","정좌불능","신경이완제 악성 증후군"],"되돌리기 어려운 경우가 많아서 예방과 조기 발견이 중요해요."],
[D7,"가만히 있지 못하고 계속 서성이며 내적 초조감을 호소하는 항정신병 약물 부작용은?",["정좌불능(좌불안석)","지연성 운동장애","파킨슨증","급성 근긴장이상"],"초조나 정신병 악화로 잘못 보기 쉬워요. 용량을 줄이거나 베타차단제를 써요."],
[D7,"급성 근긴장이상(목이 뒤틀리고 눈이 위로 돌아감)의 응급 치료는?",["항콜린제나 항히스타민제 근육주사","리튬 투여","항정신병 약물 증량","전기경련요법"],"약을 시작하고 며칠 안에, 젊은 남성에게 고역가 약물을 쓸 때 잘 생겨요."],
[D7,"SSRI의 대표적인 부작용은?",["성기능 장애와 위장 장애","무과립구증","티라민으로 인한 고혈압 위기","갑상선기능저하증"],"티라민으로 인한 고혈압 위기는 MAOI의 부작용이에요."],
[D7,"MAOI를 복용하는 환자가 피해야 할 음식은?",["숙성 치즈, 와인 등 티라민이 많은 음식","우유","쌀밥","사과"],"티라민이 분해되지 못해 혈압이 급격히 오를 수 있어요."],
[D7,"세로토닌 증후군이 생기기 쉬운 경우는?",["SSRI와 MAOI를 함께 복용","리튬 저용량 단독 복용","벤조디아제핀 단독 복용","항정신병 약물 중단"],"고열, 근간대경련, 설사, 초조 등이 나타나요. MAOI를 다른 약으로 바꿀 때는 약을 끊고 기다리는 기간이 필요합니다."],
[D7,"벤조디아제핀 과다복용의 해독제는?",["플루마제닐","날록손","날트렉손","피조스티그민"],"날록손은 아편계 과다복용의 해독제예요."],
[D7,"ADHD의 1차 약물은?",["메틸페니데이트(중추신경자극제)","할로페리돌","리튬","벤조디아제핀"],"비자극제로는 아토목세틴이 있어요."],
[D7,"기분조절제와 주의할 점의 연결로 옳은 것은?",["발프로산: 임신 중 신경관 결손 위험","리튬: 무과립구증","라모트리진: 체중 감소","카바마제핀: 저나트륨혈증 없음"],"라모트리진은 스티븐스-존슨 증후군, 카바마제핀은 무과립구증·저나트륨혈증을 주의해야 해요."],
[D7,"Beck의 인지삼제(cognitive triad)는?",["자기, 세상, 미래에 대한 부정적 관점","이드, 자아, 초자아","사고, 감정, 행동","과거, 현재, 미래의 기억"],"우울증 인지치료의 핵심 개념이에요."],
[D7,"중독 내담자의 양가감정을 탐색하고 변화 대화를 끌어내는 상담 기법은?",["동기강화상담","고전적 정신분석","체계적 둔감법","혐오치료"],"Miller와 Rollnick이 만들었어요. 직면하기보다 저항과 함께 구르기(rolling with resistance)를 강조합니다."],
[D7,"변화단계모형에서 '문제는 알지만 아직 바꿀 결심을 못한' 단계는?",["숙고 단계","숙고 전 단계","준비 단계","실행 단계"],"숙고 전 → 숙고 → 준비 → 실행 → 유지 단계로 진행해요."],
// ── D8 자살·지역사회·법
[D8,"자살 역학에 대한 설명으로 옳은 것은?",["자살 사망은 남성이 더 많고, 자살 시도는 여성이 더 많다","자살 사망률은 여성이 더 높다","자살 시도는 남성이 더 많다","나이가 들수록 자살률은 줄어든다"],"교재 기준으로 자살 사망은 남성이 약 3배, 자살 시도는 여성이 약 4배 많아요."],
[D8,"지역사회정신의학이 본격적으로 시작된 계기는?",["1960년대 미국 지역사회정신보건센터법 제정","1808년 독일에서 'psychiatry' 용어 사용","Kraepelin의 조발성 치매 분류","1950년대 클로르프로마진 개발"],"이후 탈원화와 지역사회 중심 서비스로 이어졌어요."],
[D8,"자살 위험을 가장 강하게 예측하는 요인은?",["과거 자살 시도력","기혼 상태","종교 활동","돌봐야 할 자녀가 있음"],"나머지 보기는 보호 요인이에요."],
[D8,"자살 사망자에게 가장 흔한 정신질환은?",["우울증(기분장애)","강박장애","특정공포증","적응장애"],"교재는 자살자의 약 80%가 우울증과 관련된다고 설명하고, 그다음으로 조현병, 치매·섬망을 꼽아요."],
[D8,"우울증 치료 중 자살 위험이 특히 높아질 수 있는 시기는?",["치료 초기, 에너지가 먼저 회복될 때","증상이 완전히 없어진 지 몇 년 뒤","입원 직후 첫 1시간만","약을 처음 먹은 첫날만"],"의욕이 먼저 돌아오고 우울한 생각은 남아 있을 때, 실행할 힘이 생겨 위험해질 수 있어요."],
[D8,"정신과 진료의 비밀보장에 대한 설명으로 옳은 것은?",["자살이나 타해 위험이 있으면 예외가 될 수 있음","어떤 경우에도 예외는 없음","가족이 요청하면 항상 공개함","외래 환자에게는 적용되지 않음"],"재판이나 법령이 정한 경우에도 정보를 제공할 수 있어요."],
[D8,"3차 예방에 해당하는 것은?",["재활과 사회복귀로 장애를 최소화","질병 발생 자체를 막음","선별검사로 조기 발견","고위험군 대상 교육"],"1차는 발생 예방, 2차는 조기 발견과 치료, 3차는 재활과 재발 방지예요."],

function floatText(t,color){const d=document.createElement("div");d.className="float";d.textContent=t;if(color)d.style.color=color;document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
function rankLabel(r){return TIERS[r.t].n+(r.t<TOP?" "+ROMAN[r.d]:"")}
function rankScore(r){return r.t*400+(r.t<TOP?(4-r.d)*100:0)+r.lp}
function emblem(r,size){const T=TIERS[r.t];return `<div class="emblem" style="--tc:${T.c};width:${size}px;height:${size}px;font-size:${size*.42}px"><span>${T.e}</span></div>`}

// 문항 판정: 기록(본 문제·오답노트·도감)을 바로 반영
function judge(q,k){
  seen.add(q.id);
  let r;
  if(k===-1)r="idk";else if(k===q.a)r="ok";else r="ng";
  if(r==="ok"){wrong.delete(q.id);codex.add(q.id)}else wrong.add(q.id);
  save();return r;
}

// ===================== 랭크/LP =====================
function applyLP(delta){
  const r=S.rank,ev=[];
  if(r.promo)return ev; // 승급전 대기 중에는 LP 고정
  r.lp+=delta;
  if(r.t===TOP){if(r.lp<0)r.lp=0;return ev}
  while(r.lp>=100&&r.d>1){r.lp-=100;r.d--;ev.push({k:"up",t:rankLabel(r)})}
  if(r.d===1&&r.lp>=100){r.lp=100;r.promo=true;ev.push({k:"promo",t:`${TIERS[r.t+1].n} 승급전 진입!`})}
  if(r.lp<0){if(r.d<4){r.d++;r.lp+=LP.demoteTo;ev.push({k:"down",t:rankLabel(r)})}else r.lp=0}
  S.rec.peak=Math.max(S.rec.peak,rankScore(r));
  return ev;
}

// ===================== 공통 문제 카드 =====================
function qCard(q,r,opt){
  opt=opt||{};const hid=opt.hidden||new Set();
  const btns=q.o.map((t,k)=>{
    if(!r&&hid.has(k))return `<button class="opt gone" disabled>${k+1}. ─</button>`;
    let c="";if(r){if(k===q.a)c="ok";else if(k===q.pick)c="ng"}
    return `<button class="opt ${c}" data-k="${k}" ${r?"disabled":""}>${k+1}. ${esc(t)}</button>`}).join("");
  const head=r==="ok"?"정답!":r==="ng"?(q.timeout?"⏰ 시간 초과! 정답은 ":"아쉬워요, 정답은 ")+(q.a+1)+"번":"정답은 "+(q.a+1)+"번이에요";
  return `<div class="card" id="qc">
   <div class="meta"><span class="tag">${q.d}</span><span>${opt.counter||""}</span></div>
   <p class="q">${esc(q.q)}</p>${btns}
   ${opt.noIdk?"":`<button class="idkbtn" id="idk" ${r?"disabled":""}>🤔 모름 (정답 보기)</button>`}
   ${r?`<div class="fb ${r}"><div class="h">${head}${opt.gain?`<span class="gain">${opt.gain}</span>`:""}</div>${esc(q.e)}</div>
   <div class="nav"><button class="btn" id="next">${opt.nextLabel||"다음 →"}</button></div>`:""}
  </div>`;
}
function bindQ(onPick,onNext){
  app.querySelectorAll(".opt[data-k]").forEach(b=>b.onclick=()=>onPick(+b.dataset.k));
  const i=document.getElementById("idk");if(i)i.onclick=()=>onPick(-1);
  const n=document.getElementById("next");if(n)n.onclick=onNext;
}

// ===================== 보스 레이드 =====================
let G;
function startRaid(){
  const doms=shuf(CORE.slice()).slice(0,3).concat(shuf(DOMS.filter(d=>!CORE.includes(d))).slice(0,2));
  const taken=new Set();
  const bosses=shuf(doms).map(d=>{const ids=pickIds(idsOf(d),5,taken);ids.forEach(i=>taken.add(i));return {d,...BOSS[d],hp:100,qs:ids.map(toQ),dead:false}});
  G={mode:"raid",bosses,bi:0,qi:0,hearts:5,combo:0,maxCombo:0,lp:0,log:[],before:{...S.rank}};
  raidQ();
}
function raidHeader(hit){
  const b=G.bosses[G.bi];
  return `<div class="arena">
   <div class="bossrow">
     <div class="bossemoji ${hit||""} ${b.dead?"dead":""}">${b.e}</div>
     <div class="bossinfo"><div class="bossname">BOSS ${G.bi+1}/5 · ${b.n}</div><div class="bossdom">${b.d}</div>
      <div class="hp"><i style="width:${Math.max(0,b.hp)}%"></i></div>
      <div class="hpt">HP ${Math.max(0,b.hp)} / 100 · ${b.dead?"💥 격파!":`남은 공격 ${5-G.qi}회`}</div></div>
   </div>
   <div class="plrow"><span class="hearts">${"❤️".repeat(G.hearts)}${"🖤".repeat(5-G.hearts)}</span>
    <span class="combo ${G.combo>=3?"hot":""}">🔥 ${G.combo}콤보</span>
    <span class="lpd ${G.lp>=0?"up":"down"}">${G.lp>=0?"+":""}${G.lp} LP</span></div>
   <div class="pips">${G.bosses.map((x,k)=>`<span class="${k<G.bi?(x.dead?"ok":"ng"):k===G.bi?"now":""}">${x.e}</span>`).join("")}</div>
  </div>`;
}
function raidQ(hit){
  const b=G.bosses[G.bi],q=b.qs[G.qi];
  app.innerHTML=raidHeader(hit)+qCard(q,q.r,{counter:`공격 ${G.qi+1}/5`,gain:q.gain,nextLabel:G.hearts===0?"전멸… 결과 보기":G.qi===4?"전투 결과 →":"다음 공격 →"});
  bindQ(k=>raidPick(k),raidNext);
}
function raidPick(k){
  const b=G.bosses[G.bi],q=b.qs[G.qi];q.pick=k;q.r=judge(q,k);G.log.push(q);
  let hit="";
  if(q.r==="ok"){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);const crit=G.combo>=3;const dmg=crit?30:20;
    const bonus=G.combo>=3?LP.comboMax:0;const g=LP.ok+bonus;G.lp+=g;q.gain=`+${g} LP`;
    b.hp-=dmg;hit="hit";
    if(crit)buzz(30);
    if(b.hp<=0&&!b.dead){b.dead=true;buzz([40,30,120]);G.lp+=LP.kill;q.gain+=` · 격파 +${LP.kill}`;setTimeout(()=>floatText("💥 보스 격파!","#ffc94d"),50)}
    else setTimeout(()=>floatText(crit?`⚡ 크리티컬 -${dmg}`:`-${dmg}`,crit?"#ff9d4d":"#fff"),50);
  }else if(q.r==="ng"){G.combo=0;G.hearts--;G.lp+=LP.ng;q.gain=`${LP.ng} LP · ❤️-1`;buzz([60,40,60]);hit="";setTimeout(()=>{const c=document.getElementById("qc");c&&c.classList.add("shake")},10)}
  else{G.combo=0;G.lp+=LP.idk;q.gain=`${LP.idk} LP`}
  raidQ(hit);
}
function raidNext(){
  if(G.hearts===0)return raidEnd(true);
  if(G.qi<4){G.qi++;raidQ();goTop();return}
  // 보스 전투 종료
  const b=G.bosses[G.bi];
  app.innerHTML=raidHeader()+`<div class="card hero">
    <div style="font-size:3.4rem">${b.dead?"💥":"💨"}</div>
    <h2>${b.dead?`${b.n} 격파!`:`${b.n}이(가) 도망쳤다…`}</h2>
    <p class="muted">${b.dead?"이 영역은 탄탄해요.":"5번 중 4번 이상, 콤보를 이어 맞혀야 잡을 수 있어요."}</p>
    <button class="btn big" id="go">${G.bi<4?"다음 보스 →":"레이드 결과 →"}</button></div>`;
  document.getElementById("go").onclick=()=>{if(G.bi<4){G.bi++;G.qi=0;raidQ();goTop()}else raidEnd(false)};
}
function raidEnd(wiped){
  const kills=G.bosses.filter(b=>b.dead).length,allClear=kills===5&&!wiped;
  if(allClear)G.lp+=LP.allClear;
  if(wiped)G.lp+=LP.wipe;
  S.rec.games++;if(allClear)S.rec.clears++;
  const before=rankLabel(G.before),beforeT=G.before.t;
  const ev=applyLP(G.lp);save();
  const c=G.log.filter(q=>q.r==="ok").length,n=G.log.filter(q=>q.r==="ng").length,u=G.log.filter(q=>q.r==="idk").length;

  const misses=G.log.filter(q=>q.r!=="ok");

  const summary=`[보스 레이드 결과] ${title.replace(/^\S+ /,"")}\n랭크: ${before} → ${rankLabel(S.rank)} (${G.lp>=0?"+":""}${G.lp} LP)\n격파 ${kills}/5 · 정답 ${c} · 오답 ${n} · 모름 ${u} · 최대콤보 ${G.maxCombo}\n`+D.map(([k,v])=>`- ${k}: ${v.c}/${v.t}`).join("\n")+`\n틀리거나 모른 문제: `+(misses.map(q=>q.q.slice(0,22)+"…").join(" / ")||"없음");
  app.innerHTML=`<div class="card hero">
    <h1 style="margin:0">${title}</h1>
    <div class="bosslist">${G.bosses.map(b=>`<span class="${b.dead?"ok":"ng"}">${b.e}<small>${b.dead?"격파":"도주"}</small></span>`).join("")}</div>
    <div class="rkchange">
      <div>${emblem(G.before,54)}<small>${before}</small></div>
      <div class="arrow ${G.lp>=0?"up":"down"}">${G.lp>=0?"+":""}${G.lp} LP<br>➜</div>
      <div>${emblem(S.rank,54)}<small>${rankLabel(S.rank)}</small></div>
    </div>
    ${ev.map(e=>`<div class="event ${e.k}">${e.k==="up"?"⬆️ 승급! "+e.t:e.k==="down"?"⬇️ 강등… "+e.t:"🏆 "+e.t}</div>`).join("")}
    ${S.rank.t<TOP&&!S.rank.promo?`<div class="lpbar" style="margin-top:12px"><i style="width:${S.rank.lp}%"></i></div><div class="muted">${S.rank.lp} / 100 LP</div>`:""}
    <div class="stats"><div><b>${c}</b><small>정답</small></div><div><b>${n}</b><small>오답</small></div><div><b>${u}</b><small>모름</small></div><div><b>${G.maxCombo}</b><small>최대 콤보</small></div></div>
  </div>
  <div class="card"><b>이번 판 영역별 결과</b>${D.map(([k,v])=>{const r=v.c/v.t,col=r>=.8?"var(--ok)":r>=.5?"var(--gold)":"var(--ng)";return `<div class="row"><span>${BOSS[k].e} ${k}</span><span class="b"><i style="width:${r*100}%;background:${col}"></i></span><span>${v.c}/${v.t}</span></div>`}).join("")}
   ${weak.length?`<p style="margin:12px 0 0"><b>다음 퀘스트</b></p><ul>${weak.map(w=>`<li><b>${w}</b>: ${STUDY[w]}</li>`).join("")}</ul>`:""}</div>
  ${misses.length?`<div class="card"><b>틀리거나 모른 문제</b>${misses.map(q=>`<div class="wrong">${esc(q.q)} <span class="muted">(${q.r==="idk"?"모름":"오답"})</span><br><span class="a">정답: ${esc(q.o[q.a])}</span><br><span class="muted">${esc(q.e)}</span></div>`).join("")}</div>`:""}
  <div class="card"><b>결과를 채팅에 붙여넣기</b><pre>${esc(summary)}</pre>
   <div class="nav" style="justify-content:flex-start;gap:8px;flex-wrap:wrap"><button class="btn" id="cp">결과 복사</button>
   ${S.rank.promo?`<button class="btn promo-btn" id="pr">🏆 승급전 도전</button>`:`<button class="btn" id="again">⚔️ 한 판 더</button>`}
   <button class="btn ghost" id="lb">로비로</button></div></div>`;
  document.getElementById("cp").onclick=async e=>{try{await navigator.clipboard.writeText(summary);e.target.textContent="복사됐어요 ✓"}catch(_){e.target.textContent="위 텍스트를 직접 복사해 주세요"}};
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
  on("again",startRaid);on("pr",startPromo);on("lb",lobby);
  if(ev.some(e=>e.k==="up"||e.k==="promo"))setTimeout(()=>floatText(ev.some(e=>e.k==="promo")?"🏆 승급전 진입!":"⬆️ RANK UP!","#ffc94d"),200);
  goTop();

// ===================== 승급전 =====================
function startPromo(){
  const ids=pickIds(BANK.map((_,i)=>i).filter(i=>CORE.includes(BANK[i][0])),5);
  G={mode:"promo",qs:ids.map(toQ),i:0,ok:0,ng:0};promoQ();
}
function promoHead(){
  const r=S.rank;return `<div class="arena promo"><div class="promo-title">🏆 승급전</div>
   <div class="rkchange small"><div>${emblem(r,44)}<small>${TIERS[r.t].n}</small></div><div class="arrow up">➜</div><div>${emblem({t:r.t+1,d:4,lp:0},44)}<small>${TIERS[r.t+1].n}</small></div></div>
   <div class="pips big">${G.qs.map((q,k)=>`<span class="${q.r||(k===G.i?"now":"")}">${q.r==="ok"?"✔":q.r?"✖":k+1}</span>`).join("")}</div>
   <div class="muted">5문제 중 3개를 맞히면 승급 · 현재 ${G.ok}승 ${G.ng}패</div></div>`;
}
function promoQ(){
  const q=G.qs[G.i];app.innerHTML=promoHead()+qCard(q,q.r,{counter:`${G.i+1} / 5`,nextLabel:(G.ok>=3||G.ng>=3)?"결과 보기":"다음 →"});
  bindQ(k=>{q.pick=k;q.r=judge(q,k);if(q.r==="ok")G.ok++;else G.ng++;promoQ()},()=>{if(G.ok>=3||G.ng>=3||G.i===4)promoEnd();else{G.i++;promoQ();goTop()}});
}
function promoEnd(){
  const r=S.rank,win=G.ok>=3,from=TIERS[r.t].n;
  if(win){r.t++;r.d=r.t===TOP?0:4;r.lp=0;r.promo=false}else{r.lp=LP.promoFail;r.promo=false}
  S.rec.peak=Math.max(S.rec.peak,rankScore(r));save();
  app.innerHTML=`<div class="card hero ${win?"celebrate":""}">
    ${emblem(r,120)}
    <h1>${win?`${TIERS[r.t].n} 승급!`:"승급 실패…"}</h1>
    <p>${win?`${from}에서 <b style="color:${TIERS[r.t].c}">${TIERS[r.t].n}</b>(으)로 올라갔어요.${r.t===TOP?" 최고 등급이에요. 이제 LP를 계속 쌓아보세요.":""}`:`${G.ok}승 ${G.ng}패예요. ${rankLabel(r)} ${LP.promoFail} LP로 돌아가요. 레이드로 30 LP만 더 모으면 다시 도전할 수 있어요.`}</p>
    <div class="nav" style="justify-content:center;gap:8px"><button class="btn" id="again">⚔️ 레이드 하기</button><button class="btn ghost" id="lb">로비로</button></div></div>`;
  document.getElementById("again").onclick=startRaid;document.getElementById("lb").onclick=lobby;
  if(win){for(let k=0;k<3;k++)setTimeout(()=>floatText(["🎉","👑","✨"][k]+" PROMOTED!","#ffc94d"),k*350)}
  goTop();
}

// ===================== 생존 모드 =====================
function startSurv(){
  const ids=pickIds(BANK.map((_,i)=>i),BANK.length);
  G={mode:"surv",queue:ids,i:0,hearts:3,score:0,fifty:2,revive:1,q:null,hidden:new Set()};
  G.q=toQ(G.queue[0]);survQ();
}
function survQ(){
  const q=G.q;
  app.innerHTML=`<div class="arena"><div class="plrow"><span class="hearts big">${"❤️".repeat(G.hearts)}${"🖤".repeat(3-G.hearts)}</span><span class="score">🏅 ${G.score}문제</span></div>
   <div class="items"><button class="item" id="ff" ${G.fifty&&!q.r?"":"disabled"}>✂️ 50:50 ×${G.fifty}</button><span class="item ghost">💖 부활 ×${G.revive}</span><span class="muted" style="margin-left:auto">최고 ${S.rec.surv}문제</span></div></div>`+
   qCard(q,q.r,{counter:`${G.i+1}번째`,hidden:G.hidden,nextLabel:G.hearts===0?"게임 오버…":"다음 →"});
  const ff=document.getElementById("ff");if(ff)ff.onclick=()=>{if(!G.fifty)return;G.fifty--;const w=shuf([0,1,2,3].filter(k=>k!==q.a)).slice(0,2);G.hidden=new Set(w);survQ()};
  bindQ(k=>{q.pick=k;q.r=judge(q,k);if(q.r==="ok"){G.score++;setTimeout(()=>floatText("+1","#3ddc97"),30)}else{G.hearts--;setTimeout(()=>{const c=document.getElementById("qc");c&&c.classList.add("shake")},10)}survQ()},survNext);
}
function survNext(){
  if(G.hearts===0)return survOver();
  G.i++;G.hidden=new Set();
  if(G.i>=G.queue.length){G.queue=shuf(G.queue.slice());G.i=0}
  G.q=toQ(G.queue[G.i]);survQ();goTop();
}
function survOver(){
  const rec=G.score>S.rec.surv;if(rec){S.rec.surv=G.score;save()}
  app.innerHTML=`<div class="card hero"><div style="font-size:3.4rem">💀</div><h1>게임 오버</h1>
   <p><b style="font-size:1.6rem;color:var(--ink)">${G.score}문제</b> 버텼어요${rec?" · <b style='color:var(--gold)'>신기록!</b>":` (최고 ${S.rec.surv})`}</p>
   <div class="nav" style="justify-content:center;gap:8px;flex-wrap:wrap">
    ${G.revive?`<button class="btn promo-btn" id="rv">💖 부활하기 (하트 1개)</button>`:""}
    <button class="btn" id="again">다시 도전</button><button class="btn ghost" id="lb">로비로</button></div></div>`;
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
  on("rv",()=>{G.revive--;G.hearts=1;G.i++;G.hidden=new Set();if(G.i>=G.queue.length){G.queue=shuf(G.queue.slice());G.i=0}G.q=toQ(G.queue[G.i]);survQ()});
  on("again",startSurv);on("lb",lobby);goTop();
}

// ===================== 타임어택 =====================
const TA_N=20,TA_SEC=20;
function startTA(){
  const ids=pickIds(BANK.map((_,i)=>i),TA_N);
  G={mode:"ta",qs:ids.map(toQ),i:0,score:0,ok:0,left:TA_SEC};taQ(true);
}
function taQ(fresh){
  clearInterval(timer);
  const q=G.qs[G.i];
  if(fresh){G.left=TA_SEC;G.t0=Date.now()}
  app.innerHTML=`<div class="arena"><div class="plrow"><span class="score">⏱️ ${G.i+1} / ${TA_N}</span><span class="score">⭐ ${G.score}점</span><span class="muted">최고 ${S.rec.ta}</span></div>
   <div class="timer"><i id="tbar" style="width:${G.left/TA_SEC*100}%"></i></div><div class="tleft" id="tleft">${q.r?"":Math.ceil(G.left)+"초"}</div></div>`+
   qCard(q,q.r,{counter:"",gain:q.gain,noIdk:true,nextLabel:G.i===TA_N-1?"결과 보기":"다음 →"});
  bindQ(k=>taPick(k),()=>{if(G.i===TA_N-1)taEnd();else{G.i++;taQ(true);goTop()}});
  if(!q.r){timer=setInterval(()=>{G.left=TA_SEC-(Date.now()-G.t0)/1000;const b=document.getElementById("tbar"),t=document.getElementById("tleft");
    if(b){b.style.width=Math.max(0,G.left/TA_SEC*100)+"%";b.style.background=G.left<5?"var(--ng)":""}if(t)t.textContent=Math.max(0,Math.ceil(G.left))+"초";
    if(G.left<=0){q.timeout=true;taPick(-2)}},100)}
}
function taPick(k){
  clearInterval(timer);const q=G.qs[G.i];if(q.r)return;q.pick=k;
  q.r=judge(q,k<0?-2:k);if(k===-2)q.r="ng";
  if(q.r==="ok"){const pts=100+Math.max(0,Math.round(G.left))*10;G.score+=pts;G.ok++;q.gain=`+${pts}점`;setTimeout(()=>floatText(`+${pts}`,"#ffc94d"),30)}
  else setTimeout(()=>{const c=document.getElementById("qc");c&&c.classList.add("shake")},10);
  taQ(false);
}
function taEnd(){
  clearInterval(timer);const rec=G.score>S.rec.ta;if(rec){S.rec.ta=G.score;save()}
  app.innerHTML=`<div class="card hero"><div style="font-size:3.4rem">⏱️</div><h1>${G.score}점</h1>
   <p>${TA_N}문제 중 ${G.ok}개 정답${rec?" · <b style='color:var(--gold)'>신기록!</b>":` (최고 ${S.rec.ta}점)`}</p>
   <p class="muted">정답 100점 + 남은 시간 1초당 10점</p>
   <div class="nav" style="justify-content:center;gap:8px"><button class="btn" id="again">다시 도전</button><button class="btn ghost" id="lb">로비로</button></div></div>`;
  document.getElementById("again").onclick=startTA;document.getElementById("lb").onclick=lobby;goTop();
}

// ===================== 오답 복습 =====================
function startReview(){
  const ids=shuf([...wrong]).slice(0,25);if(!ids.length)return // ===================== 설치(PWA) =====================
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;showInstallHint()});
function showInstallHint(){
  const el=document.getElementById("inst");if(!el)return;
  const standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
  if(standalone||store.get("pt_hide_inst",false))return;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(deferredPrompt){el.style.display="block";el.innerHTML=`📲 홈 화면에 앱으로 설치할 수 있어요. <button class="btn tiny" id="instgo">설치</button> <button class="btn ghost tiny" id="instx">닫기</button>`;
    document.getElementById("instgo").onclick=async()=>{deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(_){}deferredPrompt=null;el.style.display="none"}}
  else if(ios&&location.protocol==="https:"){el.style.display="block";el.innerHTML=`📲 Safari 아래쪽 <b>공유 버튼</b> → <b>홈 화면에 추가</b>를 누르면 앱처럼 쓸 수 있어요. <button class="btn ghost tiny" id="instx">닫기</button>`}
  else return;
  const x=document.getElementById("instx");if(x)x.onclick=()=>{store.set("pt_hide_inst",true);el.style.display="none"};
}
if("serviceWorker" in navigator&&location.protocol==="https:"&&window.self===window.top){navigator.serviceWorker.register("sw.js").catch(()=>{})}
lobby();
  G={mode:"rv",qs:ids.map(toQ),i:0};rvQ();
}
function rvQ(){
  const q=G.qs[G.i];
  app.innerHTML=`<div class="arena"><div class="plrow"><span class="score">📕 오답 복습</span><span class="muted">${G.i+1} / ${G.qs.length} · 맞히면 오답노트에서 졸업</span></div></div>`+qCard(q,q.r,{nextLabel:G.i===G.qs.length-1?"결과 보기":"다음 →",gain:q.r==="ok"?"🎓 졸업!":""});
  bindQ(k=>{q.pick=k;q.r=judge(q,k);rvQ()},()=>{if(G.i===G.qs.length-1)rvEnd();else{G.i++;rvQ();goTop()}});
}
function rvEnd(){
  const g=G.qs.filter(q=>q.r==="ok").length;
  app.innerHTML=`<div class="card hero"><div style="font-size:3.4rem">🎓</div><h1>${g}문항 졸업</h1><p>${G.qs.length}문항 중 ${g}개를 맞혀 오답노트에서 뺐어요. 남은 오답노트 ${wrong.size}문항.</p>
   <div class="nav" style="justify-content:center;gap:8px">${wrong.size?`<button class="btn" id="again">한 번 더 복습</button>`:""}<button class="btn ghost" id="lb">로비로</button></div></div>`;
  const a=document.getElementById("again");if(a)a.onclick=startReview;document.getElementById("lb").onclick=lobby;goTop();
}

   <div class="lpbar"><i style="width:${codex.size/BANK.length*100}%"></i></div><p class="muted" style="margin:6px 0 0">문제를 맞히면 카드가 열려요. 열린 카드를 누르면 해설을 다시 볼 수 있어요.</p></div>
   ${DOMS.map(d=>{const ids=idsOf(d),got=ids.filter(i=>codex.has(i)).length;return `<div class="card"><div class="cxhead"><span>${BOSS[d].e} <b>${d}</b></span><span class="muted">${got}/${ids.length}${got===ids.length?" · 🏅 완성":""}</span></div>
     <div class="cards">${ids.map(i=>codex.has(i)?`<button class="cx on" data-i="${i}">${esc(BANK[i][2][0].length>26?BANK[i][2][0].slice(0,25)+"…":BANK[i][2][0])}</button>`:`<span class="cx">?</span>`).join("")}</div></div>`}).join("")}
   <div id="modal"></div>
   <div class="nav" style="justify-content:center"><button class="btn ghost" id="lb">로비로</button></div>`;
  document.getElementById("lb").onclick=lobby;
  app.querySelectorAll(".cx.on").forEach(b=>b.onclick=()=>{const x=BANK[+b.dataset.i];document.getElementById("modal").innerHTML=`<div class="modal" id="mbg"><div class="card mcard"><div class="meta"><span class="tag">${x[0]}</span></div><p class="q">${esc(x[1])}</p><p class="a" style="color:var(--ok);font-weight:700">✔ ${esc(x[2][0])}</p><p class="muted" style="font-size:.92rem">${esc(x[3])}</p><div class="nav"><button class="btn" id="mx">닫기</button></div></div></div>`;
    document.getElementById("mx").onclick=()=>document.getElementById("modal").innerHTML="";document.getElementById("mbg").onclick=e=>{if(e.target.id==="mbg")document.getElementById("modal").innerHTML=""}});
  goTop();
}
